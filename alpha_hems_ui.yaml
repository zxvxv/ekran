  v_sell_threshold: >
    {% set start_h = v_start_ladowania | int %}
    {% set bazowy = v_prog_opacalnosci_bazowy | float(0) %}
    {% set ewakuacja = tryb_ewakuacji == 'true' or tryb_ewakuacji == true %}
    {% if (v_is_offgrid == 'true' or v_is_offgrid == true) or (v_kataklizm_aktywny == 'true' or v_kataklizm_aktywny == true) %} 9999.0
    {% elif (v_midnight_sniper_active == 'true' or v_midnight_sniper_active == true) and (now().hour >= 22 or now().hour < start_h) %}
      {{ v_sniper_threshold }}
    {% else %}
      {% set dzienne_zapotrzebowanie = cons_n_jutro | float(0) + cons_p_jutro | float(0) + cons_w_jutro | float(0) %}
      {% set bezpieczny_bufor = dzienne_zapotrzebowanie * 1.4 %}
      {% set jutro_sloneczne = v_prognoza_pv_jutro | float(0) >= bezpieczny_bufor %}
      {% set is_agresywny = states('input_boolean.alpha_rce_flaga_05') == 'on' %}
      {% set d_soc = docelowy_soc | float(((v_swap_min_soc | float) * 1.1) | round(0) | int) %}
      {% set wolny_soc = [current_soc - d_soc, 0] | max %}
      {% set wolna_energia = (wolny_soc / 100) * v_safe_cap %}
      {% if (jutro_sloneczne or ewakuacja or is_agresywny) and wolna_energia > 0 %}
        {% set snap = v_rce_master_snapshot if v_rce_master_snapshot is mapping else (v_rce_master_snapshot | from_json) %}
        {% set moc_kw = v_sell_power_w | float(6000) / 1000 %}
        {% set energia_na_slupek = moc_kw * 0.25 %}
        {% set potrzebne_slupki = (wolna_energia / energia_na_slupek) | round(0, 'ceil') | int %}
        {% if snap.future_prices | length > 0 %}
          {% set top_prices = snap.future_prices[:potrzebne_slupki] %}
          {% set min_top_price_pln = (top_prices | min / 1000) | round(4) %}
          {% if ewakuacja %}
            {{ min_top_price_pln }}
          {% else %}
            {{ [min_top_price_pln, bazowy] | min }}
          {% endif %}
        {% else %}
          {{ 0.01 if ewakuacja else bazowy }}
        {% endif %}
      {% else %}
        {{ bazowy }}
      {% endif %}
    {% endif %}

  v_potencjal_kwh: >
    {% set d_soc = docelowy_soc | float(((v_swap_min_soc | float) * 1.1) | round(0) | int) %}
    {% if current_soc > d_soc %} {{ ((current_soc - d_soc) / 100 * v_safe_cap) | round(1) }}
    {% else %} 0.0 {% endif %}

  v_tarcza_aktywna: >
    {% set now_ts = as_timestamp(now()) %}
    {% set start_tarczy_ts = as_timestamp(today_at('%02d:00' % (v_start_ladowania | int))) %}
    {% if now_ts < start_tarczy_ts or now().hour >= 19 %} false
    {% elif (v_kataklizm_aktywny == 'true' or v_kataklizm_aktywny == true) %} false
    {% else %}
      {% set snap = v_rce_master_snapshot if v_rce_master_snapshot is mapping else (v_rce_master_snapshot | from_json) %}
      {% set prog = v_sell_threshold | float(0) * 1000 %}
      {% set d_soc = docelowy_soc | float(((v_swap_min_soc | float) * 1.1) | round(0) | int) %}
      {% set wolny_soc = [current_soc - d_soc, 0] | max %}
      {% set wolna_energia = (wolny_soc / 100) * v_safe_cap %}
      {% set moc_kw = v_sell_power_w | float(6000) / 1000 %}
      {% set energia_na_slupek = moc_kw * 0.25 %}
      {% set max_slupkow = (wolna_energia / energia_na_slupek) | round(0, 'ceil') | int %}
      {% set ns = namespace(future_active=[], first_sell_ts=9999999999) %}
      {% if max_slupkow > 0 %}
        {% for slot in snap.future_slots %}
          {% if slot.cena >= prog %}
            {% set ns.future_active = ns.future_active + [slot] %}
          {% endif %}
        {% endfor %}
        {% if ns.future_active | length > 0 %}
          {% set top_slupki = (ns.future_active | sort(attribute='cena', reverse=true))[:max_slupkow] %}
          {% for b in top_slupki %}
            {% if b.ts < ns.first_sell_ts %} {% set ns.first_sell_ts = b.ts %} {% endif %}
          {% endfor %}
        {% endif %}
      {% endif %}
      {% set fallback_tarczy_ts = as_timestamp(today_at('19:00')) %}
      {% set end_tarczy_ts = (ns.first_sell_ts - 900) if ns.first_sell_ts < 9999999999 else fallback_tarczy_ts %}
      {{ 'true' if now_ts < end_tarczy_ts else 'false' }}
    {% endif %}

  v_plan_sprzedazy: >-
    {% set start_h = v_start_ladowania | int %}
