              {% set ns.future_active = ns.future_active + [slot] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {% if ns.future_active | length > 0 %}
          {% set top_slupki = (ns.future_active | sort(attribute='cena', reverse=true))[:max_slupkow] %}
          {% for b in top_slupki %}
            {% if now_ts >= b.ts and now_ts < (b.ts + 900) %} 
              {% set ns.is_now = true %} 
            {% endif %}
          {% endfor %}
          {{ 'Sprzedaż' if ns.is_now else 'Oczekiwanie' }}
        {% else %} Oczekiwanie {% endif %}
      {% else %} Oczekiwanie {% endif %}
    {% endif %}

  v_zysk_dzisiaj: >
