  target_dump_evening: >
    {% set h = now().hour %}
    {% set m = now().minute %}
    {% set current_time_hours = h + (m / 60.0) %}
    {% set end_cheap = (v_start_ladowania | int) + 4 %}
    {% set caly_wieczor_h = 22.0 - end_cheap %}
    {% set temp_zostalo = [(22.0 - current_time_hours), caly_wieczor_h] | min %}
    {% set zostalo_wieczoru_h = [temp_zostalo, 0.0] | max %}
    {% set srodek_wieczoru_kwh = (cons_w | float(0) / caly_wieczor_h) * zostalo_wieczoru_h %}
    {% set energia_do_rana_kwh = srodek_wieczoru_kwh + cons_n_jutro | float(0) %}
    
    {% set pozostale_pv = states('sensor.solcast_pv_forecast_pozostala_prognoza_na_dzis') | float(0) * 0.7 %}
    {% set req_kwh_net = [energia_do_rana_kwh - pozostale_pv, 0.0] | max %}
    {% set energia_z_zapasem = req_kwh_net * 1.0 %}
    
    {% set dzienne_zapotrzebowanie = cons_n_jutro | float(0) + cons_p_jutro | float(0) + cons_w_jutro | float(0) %}
    {% set wymagane_slonce = dzienne_zapotrzebowanie * 1.4 %}
    {% set sunny = v_prognoza_pv_jutro | float(0) >= wymagane_slonce %}
    {% set smart_toggle = (v_comfort_buffer_smart == true or v_comfort_buffer_smart == 'true') %}
    {% set bufor_komkomfortu = 0 if (sunny and smart_toggle) else (v_comfort_buffer | int(0)) %}
    {% set soc_zabezpieczenia = ((energia_z_zapasem / v_safe_cap) * 100) | round(0) | int + bufor_komkomfortu + 1 %}
    {{ [soc_zabezpieczenia + v_swap_min_soc | int, 100] | min }}

  v_morning_spread_ok: >
    {% set snap = v_rce_master_snapshot if v_rce_master_snapshot is mapping else (v_rce_master_snapshot | from_json) %}
