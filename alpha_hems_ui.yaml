    {% if (v_is_offgrid == 'true' or v_is_offgrid == true) %} false
    {% elif (v_kataklizm_aktywny == 'true' or v_kataklizm_aktywny == true) %} false
    {% elif st_soc >= 98 and jutro_sloneczne %} true
