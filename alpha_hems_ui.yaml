    {% if states(s_soc) in ['unknown', 'unavailable', 'none', ''] %} 🔴 BŁĄD KRYTYCZNY: Brak połączenia Modbus (Inwerter Offline)
    {% elif states(curr_ent) in ['unknown', 'unavailable', 'none', ''] or states(sell_power_ent) in ['unknown', 'unavailable', 'none', ''] or states(tou1_s) in ['unknown', 'unavailable', 'none', ''] %} 🔴 BŁĄD STRUKTURY: Brak encji wykonawczej (ESPHome Literówka!)
    {% elif offg %} ⚠️ TARCZA BLACKOUTOWA (Tryb Wyspowy / Off-Grid)
    {% elif (v_license_buffer | int(1)) == 2 %}
      {% if tryb_ewakuacji == 'true' or tryb_ewakuacji == true %} ⚠️ Zrzut Awaryjny (Obrona Płotka)
      {% elif w_dolku %} 🎯 TARCZA DOŁKA (Blokada Maklera)
      {% elif v_force_sell_evening == 'true' or v_force_sell_evening == true %} 🌇 WIECZORNY HANDEL (Wysoka Marża)
      {% elif v_ev_grid_lock == 'true' or v_ev_grid_lock == true %} 🚗 EV Grid-Lock (Bypass)
      {% elif is_morning_bypass %} ☀️ BYPASS PV (Czekam na dołek o {{ v_start_ladowania }}:00)
      {% elif is_midnight_sniper %}
        {% if v_plan_sprzedazy == 'Sprzedaż' %} ☀️ Nocny/Poranny Snajper (Zrzut w blokach)
        {% else %} ☀️ Oczekiwanie Snajpera (Szukam dołków)
        {% endif %}
      {% elif should_arbitrage == 'True' or should_arbitrage == true %}
        {% if (v_sell_threshold | float(0)) < (v_prog_opacalnosci_bazowy | float(0)) %} 🎯 Snajper Wolumenu (Zrzut Nadwyżki)
        {% else %} 💰 Arbitraż RCE {% endif %}
      {% elif should_charge_to_sell == 'True' or should_charge_to_sell == true %} ⚡ Ładowanie pod Sprzedaż
      {% else %} 🏠 Oczekiwanie / Tryb Bilansowy {% endif %}
    {% elif (v_license_buffer | int(1)) == 1 %}
      🏠 Tryb Bilansowy (Licencja BASIC)
    {% else %}
      🔴 BRAK LICENCJI (Zablokowano)
    {% endif %}

  # =============================================================
  # SILNIK 1: BYPASS ŁADOWANIA (OCHRONA PŁOTKA I BLOKADA PORANKA)
  # =============================================================
  v_chce_ladowac: >
    {% set h = now().hour %}
    {% set is_cheap_night = (h >= 22 or h < 6) %}
    {% set start_h = v_start_ladowania | int(13) %}
    {% set is_cheap_day = (h >= start_h and h < (start_h + 2)) %}
    
    {% set is_cheap = (is_cheap_night or is_cheap_day) %}
    
    {% set force_charge = (should_charge_to_sell == 'True' or should_charge_to_sell == true) %}
    {% set is_balancing = (states('input_number.alpha_rce_param_42') | float(0) >= 21) %}
    
    {% set symulacja = v_sim | string | lower %}
    {% set net_billing = v_net_billing | string | lower %}
    {% set zablokuj_bypass = (symulacja == 'true' or net_billing == 'false') %}
    {% set req_pv = ((cons_n | float(0) + cons_p | float(0) + cons_w | float(0)) * 1.4) | round(2) %}
    {% set total_pv_today = v_pv_dzis | float(0) %}
    {% set podloga = v_swap_min_soc | float(20) %}
    {% set smart_toggle = (v_comfort_buffer_smart == true or v_comfort_buffer_smart == 'true') %}
    {% set bufor_komfortu = 0 if (total_pv_today >= req_pv and smart_toggle) else (v_comfort_buffer | int(0)) %}
    {% set twarda_podloga = podloga + bufor_komfortu %}
    
    {% set is_morning_bypass = (not zablokuj_bypass) and (6 <= h < start_h) and current_soc >= twarda_podloga and total_pv_today >= req_pv %}
    
    {% if (v_is_offgrid == 'true' or v_is_offgrid == true) %}
      true
    {% elif is_morning_bypass and not force_charge and not is_balancing %}
      false
    {% else %}
      {{ 'true' if (is_cheap or force_charge or is_balancing) else 'false' }}
    {% endif %}
# =============================================================
# === KONIEC CZĘŚCI 2 ===
# =============================================================
# =============================================================
# === POCZĄTEK CZĘŚCI 3 (Wyzwalacze i Akcje Ochronne) ===
# =============================================================
triggers:
  - platform: time_pattern
    minutes: "/1"
  - platform: time
    at:
      - '00:15:00'
      - '02:00:00'
      - '05:00:00'
      - '05:57:00'
      - '06:00:00'
      - '12:57:00'
      - '13:00:00'
      - '13:05:00'
      - '14:00:00'
      - '14:55:00'
      - '14:57:00'
      - '15:00:00'
      - '15:05:00'
      - '16:00:00'
      - '17:00:00'
      - '21:00:00'
      - '21:57:00'
      - '22:00:00'
      - '22:05:00'
      - '23:56:00'
      - '23:59:00'
  - platform: state
    entity_id: input_boolean.alpha_rce_flaga_10
    to: 'on'
    id: "setup_trigger"
  - platform: state
    entity_id: input_boolean.alpha_rce_flaga_11
    to: 'on'
    id: "reset_trigger"
  - platform: homeassistant
    event: start
action:
  # =============================================================
  # DETEKCJA AWARII SIECI (TARCZA BLACKOUTOWA) - MINUTE LOOP
  # =============================================================
  - if:
      - condition: template
        value_template: >
          {% if trigger is undefined or trigger is none %} false
          {% elif trigger.platform is defined and trigger.platform == 'time_pattern' %} true
          {% else %} false {% endif %}
    then:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ v_max_grid | float < 100.0 }}"
              - condition: template
                value_template: "{{ states('input_boolean.alpha_rce_flaga_15') == 'off' }}"
            sequence:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.alpha_rce_flaga_15 }
              - action: persistent_notification.create
                data:
                  title: "⚠️ ALPHA HEMS: TARCZA BLACKOUTOWA"
                  message: "Wykryto awarię sieci. System przechodzi w tryb przetrwania (Off-grid override)."
          - conditions:
              - condition: template
                value_template: "{{ v_max_grid | float > 200.0 }}"
              - condition: template
                value_template: "{{ states('input_boolean.alpha_rce_flaga_15') == 'on' }}"
            sequence:
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.alpha_rce_flaga_15 }
              - action: persistent_notification.create
                data:
                  title: "✅ ALPHA HEMS: SIEĆ PRZYWRÓCONA"
                  message: "Napięcie sieci stabilne. Tarcza Blackoutowa opuszczona, powrót do standardowej logiki."

  # =============================================================
  # PRE-EMPTIVE WAKE-UP (WYBUDZANIE CHMURY TUYA)
  # =============================================================
  - if:
      - condition: template
        value_template: >
          {% if trigger is undefined or trigger is none %} false
          {% elif trigger.platform is defined and trigger.platform == 'time' %}
            {{ now().strftime('%H:%M') in ['05:57', '12:57', '14:57', '21:57', '23:56'] }}
          {% else %} false {% endif %}
    then:
      - if:
          - condition: template
            value_template: "{{ v_ev_sensor | length > 5 }}"
        then:
          - action: homeassistant.update_entity
            target: { entity_id: "{{ v_ev_sensor }}" }
            continue_on_error: true

  # =============================================================
  # BRAMKA BEZPIECZEŃSTWA (DEEP SCAN I OCHRONA PRZED RACE CONDITION)
  # =============================================================
  - if:
      - condition: template
        value_template: >
          {% if trigger is undefined or trigger is none %} true
          {% elif trigger.platform is undefined or trigger.platform is none %} true
          {% elif trigger.platform is defined and trigger.platform == 'homeassistant' %} true
          {% elif trigger.id is defined and trigger.id in ['setup_trigger', 'reset_trigger'] %} true
          {% else %} false {% endif %}
    then:
      # JEDNORAZOWY STARTOWY OPÓŹNIACZ (RACE CONDITION FIX)
      - action: persistent_notification.create
        data:
          title: "⏳ ALPHA HEMS: Inicjalizacja Modbus"
          message: "Uruchamiam system w trybie opóźnionego zapłonu. Oczekuję na nawiązanie komunikacji z inwerterem (max 3 minuty)..."
        
      - wait_template: "{{ states(s_soc) not in ['unknown', 'unavailable', 'none', ''] }}"
        timeout: "00:03:00"
        continue_on_timeout: true

  # BEZWZGLĘDNA BLOKADA PĘTLI DECYZYJNEJ (DZIAŁA PRZY KAŻDYM PRZEBIEGU)
  - if:
      - condition: template
        value_template: >
          {{ states(s_soc) in ['unknown', 'unavailable', 'none', ''] or 
             states(curr_ent) in ['unknown', 'unavailable', 'none', ''] or
             states(sell_power_ent) in ['unknown', 'unavailable', 'none', ''] or
             states(work_mode_ent) in ['unknown', 'unavailable', 'none', ''] or
             states(tou1_s) in ['unknown', 'unavailable', 'none', ''] }}
    then:
      - action: input_text.set_value
        target: { entity_id: input_text.alpha_rce_stan_03 }
        data: { value: "{{ v_status_systemu }}" }
      - stop: "BŁĄD STRUKTURY: Brak komunikacji Modbus lub brakuje encji wykonawczej (Literówka). Pętla zatrzymana."

  # INICJALIZACJA I POWIADOMIENIE O ZDROWYM STANIE
  - if:
      - condition: template
        value_template: >
          {% if trigger is undefined or trigger is none %} true
          {% elif trigger.platform is undefined or trigger.platform is none %} true
          {% elif trigger.platform is defined and trigger.platform == 'homeassistant' %} true
          {% elif trigger.id is defined and trigger.id in ['setup_trigger', 'reset_trigger'] %} true
          {% else %} false {% endif %}
    then:
      - action: persistent_notification.create
        data:
          title: "✅ ALPHA HEMS v8.012: Status Startowy"
          message: >
            Wykryto nową architekturę (HYBRID RADAR & DEEP SCAN): 
            - Inwerter: {{ prefix }} (Tłumacz HAL: {{ v_use_hal }})
            - Zegarmistrz ({{ v_osd }}): {{ 'LATO' if v_is_dst else 'STANDARD/ZIMA' }}
            - Magazyn: {{ cap }} kWh
            - System Rozliczeń: {{ 'Net-billing' if v_net_billing else 'Opusty (Blokada RCE)' }}
            - Cel Nocny: {{ target_night }}% / Cel Dzienny: {{ target_evening }}%
            (Struktura ESPHome weryfikowana. Aktywna tarcza EEPROM).

      - if:
          - condition: template
            value_template: >
              {% if not v_notify_on %} false
              {% elif trigger is undefined or trigger is none %} true
              {% elif trigger.platform is undefined or trigger.platform is none %} true
              {% elif trigger.id is defined and trigger.id in ['setup_trigger', 'reset_trigger'] %} true
              {% else %} false {% endif %}
        then:
          - action: "{{ 'notify.mobile_app_' ~ (v_notify_device | replace('device_tracker.', '')) }}"
            continue_on_error: true
            data:
              title: "🔔 ALPHA HEMS: Sygnał Życia"
              message: "Pancerka v8.012 gotowa. Modbus połączony, struktura zweryfikowana w 100%. EEPROM chroniony."

  # =============================================================
  # MODUŁ AUTO-KALIBRACJI (NAPRAWA POJEMNOŚCI DLA DASHBOARDU)
  # =============================================================
  - if:
      - condition: template
        value_template: "{{ states('input_number.alpha_pojemnosc_magazynu') | float(-1) != (cap | float) }}"
    then:
      - action: input_number.set_value
        target: { entity_id: input_number.alpha_pojemnosc_magazynu }
        data: { value: "{{ cap }}" }
        continue_on_error: true

  # =============================================================
  # MODUŁ ALPHA SYNC (BETONOWANIE PAMIĘCI TOU)
  # =============================================================
  - if:
      - condition: template
        value_template: >
          {% if trigger is undefined or trigger is none %} true
          {% elif trigger.platform is undefined or trigger.platform is none %} true
          {% elif trigger.id is defined and trigger.id == 'setup_trigger' %} true
          {% elif trigger.platform is defined and trigger.platform == 'homeassistant' %} true
          {% else %} false {% endif %}
    then:
      - action: homeassistant.update_entity
        target: { entity_id: sensor.bms_communication_offset }
        continue_on_error: true
      - delay: "00:00:02"

      - action: persistent_notification.create
        data:
          title: "⚙️ ALPHA SYNC: Betonowanie Pamięci (Zapis jednorazowy)"
          message: "Rozpoczynam uszczelnianie okienek TOU do wartości Low SOC w celu ochrony pamięci EEPROM (Z weryfikacją stanu i opóźnieniami)..."
          
      - variables:
          v_target_soc: "{{ v_low_soc | float(20) }}"
          t1: "{{ states(tou1_soc) | float(-1) }}"
          t2: "{{ states(tou2_soc) | float(-1) }}"
          t3: "{{ states(tou3_soc) | float(-1) }}"
          t4: "{{ states(tou4_soc) | float(-1) }}"
          t5: "{{ states(tou5_soc) | float(-1) }}"
          t6: "{{ states(tou6_soc) | float(-1) }}"

      - action: switch.turn_off
        target: { entity_id: ["{{ tou1_grid }}", "{{ tou2_grid }}", "{{ tou3_grid }}", "{{ tou4_grid }}", "{{ tou5_grid }}", "{{ tou6_grid }}"] }
        continue_on_error: true
      - delay: "00:00:02"

      - if:
          - condition: template
            value_template: "{{ t1 != -1 and t1 != v_target_soc }}"
        then:
          - action: number.set_value
            target: { entity_id: "{{ tou1_soc }}" }
            data: { value: "{{ v_target_soc }}" }
          - delay: "00:00:01"
      - if:
          - condition: template
            value_template: "{{ t2 != -1 and t2 != v_target_soc }}"
        then:
          - action: number.set_value
            target: { entity_id: "{{ tou2_soc }}" }
            data: { value: "{{ v_target_soc }}" }
          - delay: "00:00:01"
      - if:
          - condition: template
            value_template: "{{ t3 != -1 and t3 != v_target_soc }}"
        then:
          - action: number.set_value
            target: { entity_id: "{{ tou3_soc }}" }
            data: { value: "{{ v_target_soc }}" }
          - delay: "00:00:01"
      - if:
          - condition: template
            value_template: "{{ t4 != -1 and t4 != v_target_soc }}"
        then:
          - action: number.set_value
            target: { entity_id: "{{ tou4_soc }}" }
            data: { value: "{{ v_target_soc }}" }
          - delay: "00:00:01"
      - if:
          - condition: template
            value_template: "{{ t5 != -1 and t5 != v_target_soc }}"
        then:
          - action: number.set_value
            target: { entity_id: "{{ tou5_soc }}" }
            data: { value: "{{ v_target_soc }}" }
          - delay: "00:00:01"
      - if:
          - condition: template
            value_template: "{{ t6 != -1 and t6 != v_target_soc }}"
        then:
          - action: number.set_value
            target: { entity_id: "{{ tou6_soc }}" }
            data: { value: "{{ v_target_soc }}" }
          - delay: "00:00:01"

      - action: switch.turn_off
        target: { entity_id: ["{{ tou1_gen }}", "{{ tou2_gen }}", "{{ tou3_gen }}", "{{ tou4_gen }}", "{{ tou5_gen }}", "{{ tou6_gen }}"] }
        continue_on_error: true
      - delay: "00:00:01"

      - if:
          - condition: template
            value_template: >
              {% if trigger is undefined or trigger is none %} true
              {% elif trigger.platform is undefined or trigger.platform is none %} true
              {% elif trigger.id is defined and trigger.id == 'setup_trigger' %} true
              {% else %} false {% endif %}
        then:
          - choose:
              - conditions: "{{ v_integration == 'Solar Assistant' }}"
                sequence:
                  - action: shell_command.update_alpha_dashboard_sa
                    data: { prefix: "{{ prefix }}" }
                    continue_on_error: true
            default:
              - action: shell_command.update_alpha_dashboard_esp
                continue_on_error: true
          - action: persistent_notification.create
            data:
              title: "🚀 ALPHA SYNC: Dashboard zaktualizowany"
              message: "Odśwież stronę (F5/Przeciągnij w dół), aby zobaczyć zmiany."
          - action: input_boolean.turn_off
            target: { entity_id: input_boolean.alpha_rce_flaga_10 }
            continue_on_error: true

  # =============================================================
  # AUTONOMICZNY ZEGARMISTRZ TARYF (Self-Healing Time Sync)
  # =============================================================
  - if:
      - condition: template
        value_template: >
          {% set t4 = states(tou4_s) %}
          {% set t5 = states(tou5_s) %}
          {% if t4 in ['unknown', 'unavailable', 'none', ''] %} false
          {% elif t4[:5] != v_tou4_start or t5[:5] != v_tou5_start %} true
          {% else %} false {% endif %}
    then:
      - action: persistent_notification.create
        data:
          title: "⏰ ALPHA HEMS: Korekta Zegarmistrza"
          message: "Wykryto niezgodność godzin okienek w falowniku z profilem operatora ({{ v_osd }}). System autonomicznie rozpoczyna kaskadę zmiany czasu na: {{ v_tou4_start }} - {{ v_tou5_start }}."
      - choose:
          - conditions: "{{ v_is_dst }}"
            sequence:
              - choose:
                  - conditions: "{{ v_integration == 'Solar Assistant' }}"
                    sequence:
                      - action: select.select_option
                        target: { entity_id: "{{ tou5_s }}" }
                        data: { option: "{{ v_tou5_start }}" }
                        continue_on_error: true
                      - delay: "00:00:03"
                      - action: select.select_option
                        target: { entity_id: "{{ tou4_s }}" }
                        data: { option: "{{ v_tou4_start }}" }
                        continue_on_error: true
                default:
                  - action: time.set_value
                    target: { entity_id: "{{ tou5_s }}" }
                    data: { time: "{{ v_tou5_start }}:00" }
                    continue_on_error: true
                  - delay: "00:00:03"
                  - action: time.set_value
                    target: { entity_id: "{{ tou4_s }}" }
                    data: { time: "{{ v_tou4_start }}:00" }
                    continue_on_error: true
        default:
          - choose:
              - conditions: "{{ v_integration == 'Solar Assistant' }}"
                sequence:
                  - action: select.select_option
                    target: { entity_id: "{{ tou4_s }}" }
                    data: { option: "{{ v_tou4_start }}" }
                    continue_on_error: true
                  - delay: "00:00:03"
                  - action: select.select_option
                    target: { entity_id: "{{ tou5_s }}" }
                    data: { option: "{{ v_tou5_start }}" }
                    continue_on_error: true
            default:
              - action: time.set_value
                target: { entity_id: "{{ tou4_s }}" }
                data: { time: "{{ v_tou4_start }}:00" }
                continue_on_error: true
              - delay: "00:00:03"
              - action: time.set_value
                target: { entity_id: "{{ tou5_s }}" }
                data: { time: "{{ v_tou5_start }}:00" }
                continue_on_error: true

  # =============================================================
  # MODUŁ: AUTONAPRAWA OKIENEK TOU SOC (Strażnik Ochrony EEPROM)
  # =============================================================
  - if:
      - condition: template
        value_template: >
          {% if trigger is undefined or trigger is none %} false
          {% elif trigger.platform is defined and trigger.platform == 'time' %}
            {{ now().strftime('%H:%M') in ['02:00', '14:00'] }}
          {% else %} false {% endif %}
    then:
      - variables:
          v_target_soc: "{{ v_low_soc | float(20) }}"
          tou1_curr: "{{ states(tou1_soc) | float(-1) }}"
          tou2_curr: "{{ states(tou2_soc) | float(-1) }}"
          tou3_curr: "{{ states(tou3_soc) | float(-1) }}"
          tou4_curr: "{{ states(tou4_soc) | float(-1) }}"
          tou5_curr: "{{ states(tou5_soc) | float(-1) }}"
          tou6_curr: "{{ states(tou6_soc) | float(-1) }}"
      - if:
          - condition: template
            value_template: >
              {{ tou1_curr != -1 and (tou1_curr != v_target_soc or tou2_curr != v_target_soc or tou3_curr != v_target_soc or tou4_curr != v_target_soc or tou5_curr != v_target_soc or tou6_curr != v_target_soc) }}
        then:
          - action: persistent_notification.create
            data:
              title: "🔧 ALPHA HEMS: Autonaprawa TOU SOC"
              message: "Wykryto rozbieżność w okienkach TOU. Wyrównuję uszkodzone rejestry do sprzętowego Low SOC ({{ v_target_soc }}%) z zachowaniem ochrony pamięci Flash/EEPROM."
          - if:
              - condition: template
                value_template: "{{ tou1_curr != -1 and tou1_curr != v_target_soc }}"
            then:
              - action: number.set_value
                target: { entity_id: "{{ tou1_soc }}" }
                data: { value: "{{ v_target_soc }}" }
              - delay: "00:00:02"
          - if:
              - condition: template
                value_template: "{{ tou2_curr != -1 and tou2_curr != v_target_soc }}"
            then:
              - action: number.set_value
                target: { entity_id: "{{ tou2_soc }}" }
                data: { value: "{{ v_target_soc }}" }
              - delay: "00:00:02"
          - if:
              - condition: template
                value_template: "{{ tou3_curr != -1 and tou3_curr != v_target_soc }}"
            then:
              - action: number.set_value
                target: { entity_id: "{{ tou3_soc }}" }
                data: { value: "{{ v_target_soc }}" }
              - delay: "00:00:02"
          - if:
              - condition: template
                value_template: "{{ tou4_curr != -1 and tou4_curr != v_target_soc }}"
            then:
              - action: number.set_value
                target: { entity_id: "{{ tou4_soc }}" }
                data: { value: "{{ v_target_soc }}" }
              - delay: "00:00:02"
          - if:
              - condition: template
                value_template: "{{ tou5_curr != -1 and tou5_curr != v_target_soc }}"
            then:
              - action: number.set_value
                target: { entity_id: "{{ tou5_soc }}" }
                data: { value: "{{ v_target_soc }}" }
              - delay: "00:00:02"
          - if:
              - condition: template
                value_template: "{{ tou6_curr != -1 and tou6_curr != v_target_soc }}"
            then:
              - action: number.set_value
                target: { entity_id: "{{ tou6_soc }}" }
                data: { value: "{{ v_target_soc }}" }
# =============================================================
# === KONIEC CZĘŚCI 3 ===
# =============================================================
# =============================================================
# === POCZĄTEK CZĘŚCI 4 (Księgowość, Wykonawca, Finał) ===
# =============================================================
  # =============================================================
  # MODUŁ ZASTRZYKU DANYCH (RESET SZUFLADEK - COLD START / VAULT)
  # =============================================================
  - if:
      - condition: template
        value_template: >
          {% if trigger is undefined or trigger is none %} false
          {% elif trigger.platform is undefined or trigger.platform is none %} false
          {% elif trigger.id is defined and trigger.id == 'reset_trigger' %} true
          {% else %} false {% endif %}
    then:
      - variables:
          v_vault_raw: "{{ states('input_text.alpha_rce_stan_14') }}"
          v_has_vault: "{{ v_vault_raw is defined and v_vault_raw != 'unknown' and v_vault_raw.startswith('{') and v_vault_raw.endswith('}') }}"
        
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ v_has_vault }}"
            sequence:
              - action: persistent_notification.create
                data:
                  title: "🛡️ ALPHA HEMS: Skarbiec Aktywowany"
                  message: "Odtwarzam zapisane profile szufladek z pamięci (stan_14)."
              - variables:
                  v_vault_data: "{{ v_vault_raw | from_json }}"
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_11 }
                data: { value: "{{ v_vault_data.get('11', (in_daily_cons | float * 0.25) | round(1)) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_12 }
                data: { value: "{{ v_vault_data.get('12', (in_daily_cons | float * 0.25) | round(1)) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_13 }
                data: { value: "{{ v_vault_data.get('13', (in_daily_cons | float * 0.25) | round(1)) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_14 }
                data: { value: "{{ v_vault_data.get('14', (in_daily_cons | float * 0.25) | round(1)) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_15 }
                data: { value: "{{ v_vault_data.get('15', (in_daily_cons | float * 0.25) | round(1)) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_16 }
                data: { value: "{{ v_vault_data.get('16', (in_daily_cons | float * 0.25) | round(1)) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_17 }
                data: { value: "{{ v_vault_data.get('17', (in_daily_cons | float * 0.25) | round(1)) }}" }
              
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_21 }
                data: { value: "{{ v_vault_data.get('21', (in_daily_cons | float * 0.30) | round(1)) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_22 }
                data: { value: "{{ v_vault_data.get('22', (in_daily_cons | float * 0.30) | round(1)) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_23 }
                data: { value: "{{ v_vault_data.get('23', (in_daily_cons | float * 0.30) | round(1)) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_24 }
                data: { value: "{{ v_vault_data.get('24', (in_daily_cons | float * 0.30) | round(1)) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_25 }
                data: { value: "{{ v_vault_data.get('25', (in_daily_cons | float * 0.30) | round(1)) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_26 }
                data: { value: "{{ v_vault_data.get('26', (in_daily_cons | float * 0.30) | round(1)) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_27 }
                data: { value: "{{ v_vault_data.get('27', (in_daily_cons | float * 0.30) | round(1)) }}" }

              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_31 }
                data: { value: "{{ v_vault_data.get('31', (in_daily_cons | float * 0.45) | round(1)) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_32 }
                data: { value: "{{ v_vault_data.get('32', (in_daily_cons | float * 0.45) | round(1)) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_33 }
                data: { value: "{{ v_vault_data.get('33', (in_daily_cons | float * 0.45) | round(1)) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_34 }
                data: { value: "{{ v_vault_data.get('34', (in_daily_cons | float * 0.45) | round(1)) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_35 }
                data: { value: "{{ v_vault_data.get('35', (in_daily_cons | float * 0.45) | round(1)) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_36 }
                data: { value: "{{ v_vault_data.get('36', (in_daily_cons | float * 0.45) | round(1)) }}" }
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_37 }
                data: { value: "{{ v_vault_data.get('37', (in_daily_cons | float * 0.45) | round(1)) }}" }
                
        default:
          - action: persistent_notification.create
            data:
              title: "🔄 ALPHA HEMS: Nowe opomiarowanie"
              message: "Skarbiec pusty. Zalewam 21 szufladek na bazie {{ in_daily_cons }} kWh."
          - action: input_number.set_value
            target: { entity_id: [input_number.alpha_rce_param_11, input_number.alpha_rce_param_12, input_number.alpha_rce_param_13, input_number.alpha_rce_param_14, input_number.alpha_rce_param_15, input_number.alpha_rce_param_16, input_number.alpha_rce_param_17] }
            data: { value: "{{ (in_daily_cons | float * 0.25) | round(1) }}" }
          - action: input_number.set_value
            target: { entity_id: [input_number.alpha_rce_param_21, input_number.alpha_rce_param_22, input_number.alpha_rce_param_23, input_number.alpha_rce_param_24, input_number.alpha_rce_param_25, input_number.alpha_rce_param_26, input_number.alpha_rce_param_27] }
            data: { value: "{{ (in_daily_cons | float * 0.30) | round(1) }}" }
          - action: input_number.set_value
            target: { entity_id: [input_number.alpha_rce_param_31, input_number.alpha_rce_param_32, input_number.alpha_rce_param_33, input_number.alpha_rce_param_34, input_number.alpha_rce_param_35, input_number.alpha_rce_param_36, input_number.alpha_rce_param_37] }
            data: { value: "{{ (in_daily_cons | float * 0.45) | round(1) }}" }

      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.alpha_rce_flaga_11 }
        continue_on_error: true

  # =============================================================
  # MODUŁ LICENCJONOWANIA (HWID SYNC)
  # =============================================================
  - variables:
      raw_offset: "{{ states('sensor.bms_communication_offset') | float(-1) }}"
      curr_szufladka: "{{ states('input_number.alpha_rce_param_65') | float(-99999) }}"
      last_chg: "{{ states.sensor.bms_communication_offset.last_changed | default(now(), true) }}"
      diff_sec: "{{ (as_timestamp(now()) - as_timestamp(last_chg)) | float(0) }}"
      new_lic_value: >
        {% if raw_offset == 2 %} 2
        {% elif raw_offset == 0 %} 0
        {% elif raw_offset == 1 or raw_offset == -1 %}
          {% if curr_szufladka == 2 and diff_sec < 43200 %} 2 {% else %} 1 {% endif %}
        {% else %} {{ curr_szufladka }} {% endif %}
  - if:
      - condition: template
        value_template: "{{ new_lic_value in [0, 1, 2] and new_lic_value != curr_szufladka }}"
    then:
      - action: input_number.set_value
        target: { entity_id: input_number.alpha_rce_param_65 }
        data: { value: "{{ new_lic_value }}" }
        continue_on_error: true

  - variables:
      active_license_raw: "{{ states('input_number.alpha_rce_param_65') | float(-99999) }}"
      active_license: >
        {% if active_license_raw == -99999 %} 1
        {% else %} {{ active_license_raw | int(1) }} {% endif %}
  - action: input_text.set_value
    target: { entity_id: input_text.alpha_rce_stan_15 }
    data:
      value: >
        {% if active_license == 2 %} 🟢 PRO (Handel + Ochrona)
        {% elif active_license == 1 %} 🟡 BASIC (Tylko Ochrona)
        {% else %} 🔴 BRAK (System Zablokowany) {% endif %}
    continue_on_error: true

  # =============================================================
  # PUSH WYNIKÓW RCE DO INTERFEJSU
  # =============================================================
  - action: input_number.set_value
    target: { entity_id: input_number.alpha_rce_param_01 }
    data: { value: "{{ price_now | float(0) }}" }
  - action: input_number.set_value
    target: { entity_id: input_number.alpha_rce_param_02 }
    data: { value: "{{ v_real_cost | float(0) }}" }
  - action: input_number.set_value
    target: { entity_id: input_number.alpha_rce_param_03 }
    data: { value: "{{ v_sell_threshold | float(0) }}" }
  - action: input_number.set_value
    target: { entity_id: input_number.alpha_rce_param_04 }
    data: { value: "{{ v_potencjal_kwh | float(0) }}" }
  - action: input_text.set_value
    target: { entity_id: input_text.alpha_rce_stan_01 }
    data: { value: "{{ 'Ładowanie pod Sprzedaż' if (should_charge_to_sell == 'True' or should_charge_to_sell == true) else v_plan_sprzedazy }}" }
  - action: input_text.set_value
    target: { entity_id: input_text.alpha_rce_stan_02 }
    data: { value: "{{ v_sygnal_g12 }}" }
  - action: input_text.set_value
    target: { entity_id: input_text.alpha_rce_stan_03 }
    data: { value: "{{ v_status_systemu }}" }
  - action: input_number.set_value
    target: { entity_id: input_number.alpha_rce_param_20 }
    data: { value: "{{ docelowy_soc }}" }
  - action: input_text.set_value
    target: { entity_id: input_text.alpha_rce_stan_04 }
    data: { value: "{{ v_tou4_start }} — {{ v_tou5_start }}" }
  - action: input_text.set_value
    target: { entity_id: input_text.alpha_rce_stan_05 }
    continue_on_error: true
    data: 
      value: >
        Jutro Cel 140%: {{ ((cons_n_jutro | float(0) + cons_p_jutro | float(0) + cons_w_jutro | float(0)) * 1.4) | round(1) }} kWh | Słońce: {{ v_prognoza_pv_jutro | float(0) }} kWh

  # =============================================================
  # MODUŁ SNAJPERA MAX SOC
  # =============================================================
  - variables:
      v_max_soc_dzis: "{{ states('input_number.alpha_rce_param_41') | float(0) }}"
  - if:
      - condition: template
        value_template: "{{ current_soc > v_max_soc_dzis }}"
    then:
      - action: input_number.set_value
        target: { entity_id: input_number.alpha_rce_param_41 }
        data: { value: "{{ current_soc }}" }
        continue_on_error: true

  # =============================================================
  # MODUŁ VOLTAGE GUARD
  # =============================================================
  - if:
      - condition: template
        value_template: "{{ in_vg_2 | length > 5 }}"
    then:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ v_max_grid | float >= 251.5 }}"
              - condition: template
                value_template: "{{ states(in_vg_2) == 'off' }}"
            sequence:
              - action: homeassistant.turn_on
                target: { entity_id: "{{ in_vg_2 }}" }
          - conditions:
              - condition: template
                value_template: "{{ v_max_grid | float < 248.0 }}"
              - condition: template
                value_template: "{{ states(in_vg_2) == 'on' }}"
              - condition: template
                value_template: "{{ (as_timestamp(now()) - as_timestamp(states[in_vg_2].last_changed | default(now()))) > 300 }}"
            sequence:
              - action: homeassistant.turn_off
                target: { entity_id: "{{ in_vg_2 }}" }

  - if:
      - condition: template
        value_template: "{{ in_vg_1 | length > 5 }}"
    then:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ v_max_grid | float >= 250.0 }}"
              - condition: template
                value_template: "{{ states(in_vg_1) == 'off' }}"
            sequence:
              - action: homeassistant.turn_on
                target: { entity_id: "{{ in_vg_1 }}" }
          - conditions:
              - condition: template
                value_template: "{{ v_max_grid | float < 248.0 }}"
              - condition: template
                value_template: "{{ states(in_vg_1) == 'on' }}"
              - condition: template
                value_template: "{{ (as_timestamp(now()) - as_timestamp(states[in_vg_1].last_changed | default(now()))) > 300 }}"
            sequence:
              - action: homeassistant.turn_off
                target: { entity_id: "{{ in_vg_1 }}" }

  # =============================================================
  # MODUŁ EV SMART CHARGING (DYNAMICZNA HISTEREZA I BYPASS)
  # =============================================================
  - if:
      - condition: template
        value_template: "{{ v_ev_switch | length > 5 }}"
    then:
      - variables:
          v_voltage_spike: >
            {% if v_ev_vg == 'true' or v_ev_vg == true %}
              {% set is_on = states(v_ev_switch) == 'on' %}
              {% if v_max_grid | float >= 250.0 %} true
              {% elif is_on and v_max_grid | float >= 248.0 %} true
              {% else %} false {% endif %}
            {% else %} false {% endif %}
            
      - choose:
          - conditions: "{{ v_ev_mode == 'Tylko Słońce (Nadwyżki)' }}"
            sequence:
              - if:
                  - condition: template
                    value_template: >
                      {% set is_dyn = v_ev_dynamic_start == 'true' or v_ev_dynamic_start == true %}
                      {% set d_soc = docelowy_soc | float(100) %}
                      {% set start_soc = (d_soc + 10) if is_dyn else (v_ev_start_soc | float) %}
                      {% set stop_soc = d_soc if is_dyn else (v_ev_dynamic_limit | float + 3) %}
                      {% if v_voltage_spike == 'true' or v_voltage_spike == true %} true
                      {% elif current_soc >= start_soc %} true
                      {% elif states(v_ev_switch) == 'on' and current_soc > stop_soc %} true
                      {% else %} false {% endif %}
                then:
                  - if:
                      - condition: template
                        value_template: "{{ states(v_ev_switch) != 'on' }}"
                    then:
                      - action: homeassistant.turn_on
                        target: { entity_id: "{{ v_ev_switch }}" }
                        continue_on_error: true
                else:
                  - if:
                      - condition: template
                        value_template: "{{ states(v_ev_switch) != 'off' }}"
                    then:
                      - action: homeassistant.turn_off
                        target: { entity_id: "{{ v_ev_switch }}" }
                        continue_on_error: true
          
          - conditions: "{{ v_ev_mode == 'Automatyczny (Słońce + Noc G12)' }}"
            sequence:
              - if:
                  - condition: template
                    value_template: >
                      {% set is_dyn = v_ev_dynamic_start == 'true' or v_ev_dynamic_start == true %}
                      {% set d_soc = docelowy_soc | float(100) %}
                      {% set start_soc = (d_soc + 10) if is_dyn else (v_ev_start_soc | float) %}
                      {% set stop_soc = d_soc if is_dyn else (v_ev_dynamic_limit | float + 3) %}
                      {% set is_cheap = (now().hour >= 22 or now().hour < 6) or (v_t_aggr_start_h | int <= now().hour < v_t_prognoza_shift | int) %}
                      {% set has_surplus = current_soc >= start_soc or (states(v_ev_switch) == 'on' and current_soc > stop_soc) %}
                      {% set is_spike = v_voltage_spike == 'true' or v_voltage_spike == true %}
                      {{ is_cheap or has_surplus or is_spike }}
                then:
                  - if:
                      - condition: template
                        value_template: "{{ states(v_ev_switch) != 'on' }}"
                    then:
                      - action: homeassistant.turn_on
                        target: { entity_id: "{{ v_ev_switch }}" }
                        continue_on_error: true
                else:
                  - if:
                      - condition: template
                        value_template: "{{ states(v_ev_switch) != 'off' }}"
                    then:
                      - action: homeassistant.turn_off
                        target: { entity_id: "{{ v_ev_switch }}" }
                        continue_on_error: true
                    
          - conditions: "{{ v_ev_mode == 'Wyłączony' }}"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ v_voltage_spike == 'true' or v_voltage_spike == true }}"
                then:
                  - if:
                      - condition: template
                        value_template: "{{ states(v_ev_switch) != 'on' }}"
                    then:
                      - action: homeassistant.turn_on
                        target: { entity_id: "{{ v_ev_switch }}" }
                        continue_on_error: true
                else:
                  - if:
                      - condition: template
                        value_template: "{{ states(v_ev_switch) == 'on' }}"
                    then:
                      - action: homeassistant.turn_off
                        target: { entity_id: "{{ v_ev_switch }}" }
                        continue_on_error: true

  # =============================================================
  # KASKADA PRĄDU ŁADOWANIA Z SIECI I KAGANIEC (Zero Export Ochrona)
  # =============================================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ now().hour >= 22 or now().hour < 6 }}"
        sequence:
          - variables:
              v_new_night_current: >
                {% set offg = (v_is_offgrid == 'true' or v_is_offgrid == true) %}
                {% set current_soc_val = states(s_soc)|float(0) %}
                {% if offg %}
                  {{ c_max }}
                {% elif current_soc_val < 60 %}
                  {{ c_max }}
                {% elif current_soc_val >= 98 %}
                  {{ c_precision }}
                {% elif current_soc_val >= 90 %}
                  {{ c_low }}
                {% elif current_soc_val >= 80 %}
                  {{ c_night_throttle }}
                {% else %}
                  {{ c_dynamic_night }}
                {% endif %}
          - if:
              - condition: template
                value_template: "{{ states(curr_ent) | float(-1) != (v_new_night_current | float) }}"
            then:
              - action: number.set_value
                target: { entity_id: "{{ curr_ent }}" }
                data: { value: "{{ v_new_night_current }}" }
                continue_on_error: true

      - conditions:
          - condition: template
            value_template: "{{ 6 <= now().hour < 22 }}"
        sequence:
          - variables:
              v_new_day_current: >
                {% set offg = (v_is_offgrid == 'true' or v_is_offgrid == true) %}
                {% set symulacja = v_sim | string | lower %}
                {% set net_billing = v_net_billing | string | lower %}
                {% set zablokuj_bypass = (symulacja == 'true' or net_billing == 'false') %}
                {% set current_soc_val = states(s_soc)|float(0) %}
                {% set req_pv = ((cons_n | float(0) + cons_p | float(0) + cons_w | float(0)) * 1.4) | round(2) %}
                {% set total_pv_today = v_pv_dzis | float(0) %}
                {% set podloga = v_swap_min_soc | float(20) %}
                {% set smart_toggle = (v_comfort_buffer_smart == true or v_comfort_buffer_smart == 'true') %}
                {% set bufor_komfortu = 0 if (total_pv_today >= req_pv and smart_toggle) else (v_comfort_buffer | int(0)) %}
                {% set twarda_podloga = podloga + bufor_komfortu %}
                
                {% set is_morning_bypass = (not zablokuj_bypass) and (6 <= now().hour < v_start_ladowania) and current_soc_val >= twarda_podloga and total_pv_today >= req_pv %}
                {% set cena_ujemna = (price_now | float(1)) < 0.01 %}
                {% set is_summer_dump = (v_is_summer_dump == 'true' or v_is_summer_dump == true) and now().hour < (v_start_ladowania | int) %}
                
                {% if offg %}
                  {{ c_max }}
                {% elif cena_ujemna %}
                  {{ c_max }}
                {% elif is_morning_bypass %}
                  10
                {% elif is_summer_dump and current_soc_val <= podloga + 1 %}
                  2
                {% elif current_soc_val < 60 %}
                  {{ c_max }}
                {% elif current_soc_val >= 98 %}
                  {{ c_precision }}
                {% elif current_soc_val >= 90 %}
                  {{ c_low }}
                {% else %}
                  {{ c_max }}
                {% endif %}
          - if:
              - condition: template
                value_template: "{{ states(curr_ent) | float(-1) != (v_new_day_current | float) }}"
            then:
              - action: number.set_value
                target: { entity_id: "{{ curr_ent }}" }
                data: { value: "{{ v_new_day_current }}" }
                continue_on_error: true

  # =============================================================
  # SILNIK 2: AKCJE RCE I MAKLER
  # =============================================================
  - choose:
      - conditions: "{{ v_sim }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ states(work_mode_ent) != v_idle_mode }}"
            then:
              - action: select.select_option
                target: { entity_id: "{{ work_mode_ent }}" }
                data: { option: "{{ v_idle_mode }}" }
                continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ tou_sell_all_ent != 'switch.brak_encji' and states(tou_sell_all_ent) != 'off' }}"
            then:
              - action: switch.turn_off
                target: { entity_id: "{{ tou_sell_all_ent }}" }
                continue_on_error: true
          
          - if:
              - condition: template
                value_template: "{{ states(sell_power_ent) | float(-1) != (v_dynamic_sell_power | float) }}"
            then:
              - action: number.set_value
                target: { entity_id: "{{ sell_power_ent }}" }
                data: { value: "{{ v_dynamic_sell_power }}" }
                continue_on_error: true

      - conditions: "{{ (should_arbitrage == 'True' or should_arbitrage == true) and not v_sim }}"
        sequence:
          - if:
              - condition: template
                value_template: >
                  {% set is_selling = states(work_mode_ent) == 'Selling First' %}
                  {% set podloga = v_swap_min_soc | float %}
                  {% set sufit = docelowy_soc | float %}
                  {{ current_soc >= sufit or (is_selling and current_soc > podloga) }}
            then:
              - if:
                  - condition: template
                    value_template: "{{ states(work_mode_ent) != 'Selling First' }}"
                then:
                  - action: select.select_option
                    target: { entity_id: "{{ work_mode_ent }}" }
                    data: { option: "Selling First" }
                    continue_on_error: true
              - if:
                  - condition: template
                    value_template: "{{ tou_sell_all_ent != 'switch.brak_encji' and states(tou_sell_all_ent) != 'on' }}"
                then:
                  - action: switch.turn_on
                    target: { entity_id: "{{ tou_sell_all_ent }}" }
                    continue_on_error: true
              - delay: "00:00:01"
              - if:
                  - condition: template
                    value_template: "{{ states(sell_power_ent) | float(-1) != (v_dynamic_sell_power | float) }}"
                then:
                  - action: number.set_value
                    target: { entity_id: "{{ sell_power_ent }}" }
                    data: { value: "{{ v_dynamic_sell_power }}" }
                    continue_on_error: true
            else:
              - if:
                  - condition: template
                    value_template: "{{ current_soc <= (v_swap_min_soc | float) }}"
                then:
                  - if:
                      - condition: template
                        value_template: "{{ states(work_mode_ent) != v_idle_mode }}"
                    then:
                      - action: select.select_option
                        target: { entity_id: "{{ work_mode_ent }}" }
                        data: { option: "{{ v_idle_mode }}" }
                        continue_on_error: true
                  - if:
                      - condition: template
                        value_template: "{{ tou_sell_all_ent != 'switch.brak_encji' and states(tou_sell_all_ent) != 'off' }}"
                    then:
                      - action: switch.turn_off
                        target: { entity_id: "{{ tou_sell_all_ent }}" }
                        continue_on_error: true

      - conditions: "{{ not (should_arbitrage == 'True' or should_arbitrage == true) and not (should_charge_to_sell == 'True' or should_charge_to_sell == true) and not v_sim }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ states(work_mode_ent) != v_idle_mode }}"
            then:
              - action: select.select_option
                target: { entity_id: "{{ work_mode_ent }}" }
                data: { option: "{{ v_idle_mode }}" }
                continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ tou_sell_all_ent != 'switch.brak_encji' and states(tou_sell_all_ent) != 'off' }}"
            then:
              - action: switch.turn_off
                target: { entity_id: "{{ tou_sell_all_ent }}" }
                continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ states(sell_power_ent) | float(-1) != (v_dynamic_sell_power | float) }}"
            then:
              - action: number.set_value
                target: { entity_id: "{{ sell_power_ent }}" }
                data: { value: "{{ v_dynamic_sell_power }}" }
                continue_on_error: true

  # =============================================================
  # SILNIK 3: TWARDY STRAŻNIK EXPORTU PV (Odcięcie Guzika Solar Sell)
  # =============================================================
  - if:
      - condition: template
        value_template: "{{ solar_sell_ent != 'switch.brak_encji' }}"
    then:
      - variables:
          v_force_pv_off: >
            {% set cena = price_now | float(1) %}
            {% set offg = (v_is_offgrid == 'true' or v_is_offgrid == true) %}
            {{ offg or (cena < 0.01 and not v_sim) }}
      - if:
          - condition: template
            value_template: "{{ v_force_pv_off }}"
        then:
          - if:
              - condition: template
                value_template: "{{ states(solar_sell_ent) != 'off' }}"
            then:
              - action: switch.turn_off
                target: { entity_id: "{{ solar_sell_ent }}" }
                continue_on_error: true
        else:
          - if:
              - condition: template
                value_template: "{{ states(solar_sell_ent) != 'on' }}"
            then:
              - action: switch.turn_on
                target: { entity_id: "{{ solar_sell_ent }}" }
                continue_on_error: true

  # =============================================================
  # MODUŁ: SMART NIGHT BALANCING
  # =============================================================
  - variables:
      v_is_balancing: "{{ states('input_number.alpha_rce_param_42') | float(0) >= 21 }}"
      v_dance_window: "{{ now().hour >= 22 or now().hour < 6 }}"
      v_dance_timeout: "{{ now().hour == 5 and now().minute >= 55 }}"
      v_dance_flag_state: "{{ states('input_boolean.alpha_rce_flaga_13') }}"
      v_dance_flag_time: "{{ ((as_timestamp(now()) - as_timestamp(states['input_boolean.alpha_rce_flaga_13'].last_changed | default(now()))) / 60) | float(0) }}"

  - if:
      - condition: template
        value_template: >
          {% if trigger is undefined or trigger is none %} false
          {% elif trigger.platform is undefined or trigger.platform is none %} false
          {% elif trigger.platform is defined and trigger.platform == 'time_pattern' %} true
          {% else %} false {% endif %}
    then:
      - choose:
          # 1. ROZPOCZĘCIE WYGRZEWANIA 1.5H
          - conditions:
              - condition: template
                value_template: "{{ v_is_balancing and v_dance_window and current_soc >= 99 and v_dance_flag_state == 'off' }}"
            sequence:
              - action: input_boolean.turn_on
                target: { entity_id: input_boolean.alpha_rce_flaga_13 }
              - action: persistent_notification.create
                data:
                  title: "🔋 ALPHA HEMS: Balansowanie Rozpoczęte"
                  message: "Osiągnięto górny limit SOC. Utrzymuję ten stan łagodnym prądem przez 1.5h, aby wyrównać cele."

          # 2. ZAKOŃCZENIE WYGRZEWANIA LUB TIMEOUT
          - conditions:
              - condition: template
                value_template: "{{ v_is_balancing and v_dance_flag_state == 'on' and (v_dance_flag_time >= 90 or v_dance_timeout or not v_dance_window) }}"
            sequence:
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.alpha_rce_flaga_13 }
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_42 }
                data: { value: 0 }
                continue_on_error: true
              - action: persistent_notification.create
                data:
                  title: "✅ ALPHA HEMS: Balansowanie Zakończone"
                  message: "Zakończono wygrzewanie cel. Wracam do wyliczonych wartości Płotka."

  # =============================================================
  # REJESTRATORY ZUŻYCIA Z ODCIĘCIEM EV (SZUFLADKI Z ZEGARMISTRZEM PGE)
  # =============================================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ now().strftime('%H:%M') == '06:00' }}"
        sequence:
          - action: input_number.set_value
            target:
              entity_id: input_number.alpha_rce_param_28
            data:
              value: >
                {% if v_use_hal == 'true' or v_use_hal == true %} {{ states('sensor.alpha_hems_dobowe_zuzycie_domu') | float(0) }}
                {% else %} {{ states('sensor.' ~ prefix ~ '_daily_load_consumption') | float(0) }} {% endif %}
          - if:
              - condition: template
                value_template: "{{ v_ev_sensor | length > 5 }}"
            then:
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_29 }
                data: { value: "{{ states(v_ev_sensor) | float(0) }}" }
                
          - variables:
              v_por_start: "{{ states('input_number.alpha_rce_param_28') | float(0) }}"
              v_ev_start: "{{ states('input_number.alpha_rce_param_29') | float(0) }}"
              v_ev_end: "{{ states(v_ev_sensor) | float(0) if v_ev_sensor | length > 5 else v_ev_start }}"
              v_ev_diff: "{{ [v_ev_end - v_ev_start, 0] | max }}"
              v_load_end: >
                {% if v_use_hal == 'true' or v_use_hal == true %} {{ states('sensor.alpha_hems_dobowe_zuzycie_domu') | float(0) }}
                {% else %} {{ states('sensor.' ~ prefix ~ '_daily_load_consumption') | float(0) }} {% endif %}
              v_load_diff: "{{ [v_load_end - v_por_start, 0] | max }}"
              v_real_cons: "{{ [v_load_diff - v_ev_diff, 0.1] | max }}"
          - action: input_number.set_value
            target: { entity_id: "{{ sz_noc }}" }
            data: { value: "{{ v_real_cons | round(1) }}" }

      - conditions:
          - condition: template
            value_template: "{{ now().strftime('%H:%M') == ('%02d:00' % v_start_ladowania | int) }}"
        sequence:
          - action: input_number.set_value
            target:
              entity_id: input_number.alpha_rce_param_38
            data:
              value: >
                {% if v_use_hal == 'true' or v_use_hal == true %} {{ states('sensor.alpha_hems_dobowe_zuzycie_domu') | float(0) }}
                {% else %} {{ states('sensor.' ~ prefix ~ '_daily_load_consumption') | float(0) }} {% endif %}
          - if:
              - condition: template
                value_template: "{{ v_ev_sensor | length > 5 }}"
            then:
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_47 }
                data: { value: "{{ states(v_ev_sensor) | float(0) }}" }
                
          - variables:
              v_wie_start: "{{ states('input_number.alpha_rce_param_28') | float(0) }}"
              v_ev_start: "{{ states('input_number.alpha_rce_param_29') | float(0) }}"
              v_ev_end: "{{ states(v_ev_sensor) | float(0) if v_ev_sensor | length > 5 else v_ev_start }}"
              v_ev_diff: "{{ [v_ev_end - v_ev_start, 0] | max }}"
              v_load_end: >
                {% if v_use_hal == 'true' or v_use_hal == true %} {{ states('sensor.alpha_hems_dobowe_zuzycie_domu') | float(0) }}
                {% else %} {{ states('sensor.' ~ prefix ~ '_daily_load_consumption') | float(0) }} {% endif %}
              v_load_diff: "{{ [v_load_end - v_wie_start, 0] | max }}"
              v_real_cons: "{{ [v_load_diff - v_ev_diff, 0.1] | max }}"
          - action: input_number.set_value
            target: { entity_id: "{{ sz_por }}" }
            data: { value: "{{ v_real_cons | round(1) }}" }

      - conditions:
          - condition: template
            value_template: "{{ now().strftime('%H:%M') == '22:00' }}"
        sequence:
          - action: input_number.set_value
            target:
              entity_id: input_number.alpha_rce_param_39
            data:
              value: >
                {% if v_use_hal == 'true' or v_use_hal == true %} {{ states('sensor.alpha_hems_dobowe_zuzycie_domu') | float(0) }}
                {% else %} {{ states('sensor.' ~ prefix ~ '_daily_load_consumption') | float(0) }} {% endif %}
          - if:
              - condition: template
                value_template: "{{ v_ev_sensor | length > 5 }}"
            then:
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_48 }
                data: { value: "{{ states(v_ev_sensor) | float(0) }}" }
                
          - variables:
              v_noc_start: "{{ states('input_number.alpha_rce_param_38') | float(0) }}"
              v_ev_start: "{{ states('input_number.alpha_rce_param_47') | float(0) }}"
              v_ev_end: "{{ states(v_ev_sensor) | float(0) if v_ev_sensor | length > 5 else v_ev_start }}"
              v_ev_diff: "{{ [v_ev_end - v_ev_start, 0] | max }}"
              v_load_end: >
                {% if v_use_hal == 'true' or v_use_hal == true %} {{ states('sensor.alpha_hems_dobowe_zuzycie_domu') | float(0) }}
                {% else %} {{ states('sensor.' ~ prefix ~ '_daily_load_consumption') | float(0) }} {% endif %}
              v_load_diff: "{{ [v_load_end - v_noc_start, 0] | max }}"
              v_real_cons: "{{ [v_load_diff - v_ev_diff, 0.1] | max }}"
          - action: input_number.set_value
            target: { entity_id: "{{ sz_wie }}" }
            data: { value: "{{ v_real_cons | round(1) }}" }

      - conditions:
          - condition: template
            value_template: "{{ now().strftime('%H:%M') == '23:59' }}"
        sequence:
          - variables:
              ev_now: >
                {% if v_ev_sensor | length > 5 %}
                  {% set ev_raw = states(v_ev_sensor) %}
                  {{ ev_raw | float(0) if ev_raw not in ['unknown', 'unavailable', 'none', ''] and ev_raw | float(0) > 0 else states('input_number.alpha_rce_param_53') | float(0) }}
                {% else %} 0.0 {% endif %}
              ev_mid: "{{ states('input_number.alpha_rce_param_54') | float(0) if v_ev_sensor | length > 5 else 0.0 }}"
              ev_daily_raw: "{{ ev_now - ev_mid }}"
              ev_daily_total: >
                {% if ev_mid == 0 and ev_daily_raw > 150 %} 0.0
                {% else %} {{ [ev_daily_raw, 0] | max }} {% endif %}
                
              v_bought: >
                {% if v_use_hal == 'true' or v_use_hal == true %} {{ states('sensor.alpha_hems_dobowy_zakup_siec') | float(0) }}
                {% else %} {{ states('sensor.' ~ prefix ~ '_daily_energy_bought') | float(0) }} {% endif %}
              v_discharge: >
                {% if v_use_hal == 'true' or v_use_hal == true %} {{ states('sensor.alpha_hems_dobowe_rozladowanie_baterii') | float(0) }}
                {% else %} {{ states('sensor.' ~ prefix ~ '_daily_battery_discharge') | float(0) }} {% endif %}
              v_gen: >
                {% if v_use_hal == 'true' or v_use_hal == true %} {{ states('sensor.alpha_hems_dobowa_produkcja_generatora') | float(0) }}
                {% else %} {{ states('sensor.' ~ prefix ~ '_daily_generator_production') | float(0) }} {% endif %}
              v_pv: >
                {% if v_use_hal == 'true' or v_use_hal == true %} {{ states('sensor.alpha_hems_dobowa_produkcja_pv') | float(0) }}
                {% else %} {{ states('sensor.' ~ prefix ~ '_daily_pv_production') | float(0) }} {% endif %}
              v_sold: >
                {% if v_use_hal == 'true' or v_use_hal == true %} {{ states('sensor.alpha_hems_dobowa_sprzedaz_siec') | float(0) }}
                {% else %} {{ states('sensor.' ~ prefix ~ '_daily_energy_sold') | float(0) }} {% endif %}
              v_charge: >
                {% if v_use_hal == 'true' or v_use_hal == true %} {{ states('sensor.alpha_hems_dobowe_ladowanie_baterii') | float(0) }}
                {% else %} {{ states('sensor.' ~ prefix ~ '_daily_battery_charge') | float(0) }} {% endif %}
              v_load_raw: >
                {% if v_use_hal == 'true' or v_use_hal == true %} {{ states('sensor.alpha_hems_dobowe_zuzycie_domu') }}
                {% else %} {{ states('sensor.' ~ prefix ~ '_daily_load_consumption') }} {% endif %}
              v_load_val: "{{ v_load_raw | float(-1.0) }}"
              
              dzisiejsze_zuzycie_calkowite_raw: >
                {% if v_load_val >= 0.0 %}
                  {{ [v_load_val, 0.1] | max | round(1) }}
                {% else %}
                  {% set res = (v_bought - v_sold) + (v_discharge - v_charge) + v_gen + v_pv %}
                  {{ [res, 0.1] | max | round(1) }}
                {% endif %}
              
              dzisiejsze_zuzycie_calkowite: "{{ [dzisiejsze_zuzycie_calkowite_raw - ev_daily_total, 0.1] | max | round(1) }}"
              
              v_load_13_z_szufladki: "{{ states('input_number.alpha_rce_param_38') | float(0) }}"
              v_load_06_z_szufladki: "{{ states('input_number.alpha_rce_param_28') | float(0) }}"
              v_load_22_z_szufladki: "{{ states('input_number.alpha_rce_param_39') | float(0) }}"
              
              ev_06: "{{ states('input_number.alpha_rce_param_51') | float(0) if v_ev_sensor | length > 5 else 0.0 }}"
              ev_13: "{{ states('input_number.alpha_rce_param_52') | float(0) if v_ev_sensor | length > 5 else 0.0 }}"
              ev_22: "{{ states('input_number.alpha_rce_param_53') | float(0) if v_ev_sensor | length > 5 else 0.0 }}"
              
              zuz_por_raw: "{{ [v_load_13_z_szufladki - v_load_06_z_szufladki, 0] | max }}"
              ev_por_raw: "{{ ev_13 - ev_06 }}"
              ev_por: "{{ ev_por_raw if 0 <= ev_por_raw <= 150 else 0 }}"
              zuzycie_poranek_temp: "{{ [zuz_por_raw - ev_por, 0] | max }}"
              
              zuz_wie_raw: "{{ [v_load_22_z_szufladki - v_load_13_z_szufladki, 0] | max }}"
              ev_wie_raw: "{{ ev_22 - ev_13 }}"
              ev_wie: "{{ ev_wie_raw if 0 <= ev_wie_raw <= 150 else 0 }}"
              zuzycie_wieczor_temp: "{{ [zuz_wie_raw - ev_wie, 0] | max }}"
              
              v_zuzycie_noc_wyliczone: >
                {% set noc = dzisiejsze_zuzycie_calkowite - zuzycie_poranek_temp - zuzycie_wieczor_temp %}
                {{ [noc, 0.1] | max | round(1) }}
                
          - action: input_number.set_value
            target:
              entity_id: "{{ sz_noc }}"
            data:
              value: >
                {% set old = states(sz_noc) | float(0) %}
                {{ ((old * 3 + v_zuzycie_noc_wyliczone) / 4) | round(1) }}

          - if:
              - condition: template
                value_template: "{{ v_ev_sensor | length > 5 }}"
            then:
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_54 }
                data: { value: "{{ ev_now }}" }

          # KALIBRACJA ALPHA AI
          - variables:
              rad_ai_radar: >
                {% set ns = namespace(entity='sensor.ai_raw_forecast_data') %}
                {% for state in states.weather | selectattr('attributes.attribution', 'defined') %}
                  {% if 'Open-Meteo' in state.attributes.attribution %}
                    {% set ns.entity = state.entity_id %}
                  {% endif %}
                {% endfor %}
                {{ ns.entity }}
              rad_ai: >
                {% if rad_ai_radar.startswith('weather.') %}
                  {{ state_attr(rad_ai_radar, 'forecast') | default([], true) | map(attribute='shortwave_radiation') | select('defined') | list }}
                {% else %}
                  {{ state_attr('sensor.ai_raw_forecast_data', 'shortwave_radiation') | default([], true) }}
                {% endif %}
              today_ghi: >
                {% if rad_ai and rad_ai | length >= 24 %} {{ (rad_ai[0:24] | map('float') | sum) / 1000 }}
                {% else %} 0 {% endif %}
              stary_mnoznik_raw: "{{ states('input_number.alpha_rce_param_46') | float(-99999) }}"
              stary_mnoznik: "{{ 6.00 if stary_mnoznik_raw <= 0 else stary_mnoznik_raw }}"
              nowy_mnoznik: >
                {% if today_ghi > 0 and v_pv > 0 %}
                  {{ (((stary_mnoznik * 9.0) + (v_pv / today_ghi)) / 10.0) | round(3) }}
                {% else %}
                  {{ stary_mnoznik }}
                {% endif %}
          - action: input_number.set_value
            target:
              entity_id: input_number.alpha_rce_param_46
            data:
              value: "{{ nowy_mnoznik }}"
            continue_on_error: true

          # KSIĘGOWOŚĆ: RESETY OKRESOWE (Miesiąc i Rok)
          - variables:
              jutro_dzien: "{{ (now() + timedelta(days=1)).day }}"
              jutro_miesiac: "{{ (now() + timedelta(days=1)).month }}"
          - if:
              - condition: template
                value_template: "{{ jutro_dzien == 1 }}"
            then:
              - action: input_number.set_value
                target: { entity_id: input_number.alpha_rce_param_44 }
                data: { value: 0 }
                continue_on_error: true
              - if:
                  - condition: template
                    value_template: "{{ jutro_miesiac == 1 }}"
                then:
                  - action: input_number.set_value
                    target: { entity_id: input_number.alpha_rce_param_45 }
                    data: { value: 0 }
                    continue_on_error: true
                    
          # AKTUALIZACJA SKARBCA (ZAPIS DO input_text.alpha_rce_stan_14)
          - action: input_text.set_value
            target: { entity_id: input_text.alpha_rce_stan_14 }
            data:
              value: >
                {% set d = {
                  '11': states('input_number.alpha_rce_param_11') | float(0),
                  '12': states('input_number.alpha_rce_param_12') | float(0),
                  '13': states('input_number.alpha_rce_param_13') | float(0),
                  '14': states('input_number.alpha_rce_param_14') | float(0),
                  '15': states('input_number.alpha_rce_param_15') | float(0),
                  '16': states('input_number.alpha_rce_param_16') | float(0),
                  '17': states('input_number.alpha_rce_param_17') | float(0),
                  '21': states('input_number.alpha_rce_param_21') | float(0),
                  '22': states('input_number.alpha_rce_param_22') | float(0),
                  '23': states('input_number.alpha_rce_param_23') | float(0),
                  '24': states('input_number.alpha_rce_param_24') | float(0),
                  '25': states('input_number.alpha_rce_param_25') | float(0),
                  '26': states('input_number.alpha_rce_param_26') | float(0),
                  '27': states('input_number.alpha_rce_param_27') | float(0),
                  '31': states('input_number.alpha_rce_param_31') | float(0),
                  '32': states('input_number.alpha_rce_param_32') | float(0),
                  '33': states('input_number.alpha_rce_param_33') | float(0),
                  '34': states('input_number.alpha_rce_param_34') | float(0),
                  '35': states('input_number.alpha_rce_param_35') | float(0),
                  '36': states('input_number.alpha_rce_param_36') | float(0),
                  '37': states('input_number.alpha_rce_param_37') | float(0)
                } %}
                {{ d | to_json }}
            continue_on_error: true

  # =============================================================
  # MODUŁ KSIĘGOWY (PROFIT TRACKER) & AUTONAPRAWA
  # =============================================================
  - if:
      - condition: template
        value_template: >
          {% if trigger is undefined or trigger is none %} false
          {% elif trigger.platform is undefined or trigger.platform is none %} false
          {% elif trigger.platform is defined and trigger.platform == 'time_pattern' %} true
          {% else %} false {% endif %}
    then:
      - variables:
          v_ct_val: "{{ states(ext_ct_ent) }}"
          v_grid_val: >
            {% if v_use_hal == 'true' or v_use_hal == true %} {{ states('sensor.alpha_hems_siec_moc_calkowita') | float(0) }}
            {% else %} {{ states('sensor.' ~ prefix ~ '_grid_power') | float(0) }} {% endif %}
          v_moc_surowa: >
            {% if v_ct_val not in ['unknown', 'unavailable', 'none', ''] and v_ct_val | float(0) != 0 %}
              {{ v_ct_val | float(0) }}
            {% else %}
              {{ v_grid_val | float(0) }}
            {% endif %}
            
          v_moc_eksport: "{{ [0, (v_moc_surowa * -1)] | max }}"
          v_cena_rce: "{{ [states('input_number.alpha_rce_param_01') | float(0), 0.0] | max }}"
          
          v_zysk_minuta: >
            {% if (v_net_billing == 'true' or v_net_billing == true) %}
              {{ ((v_moc_eksport / 1000) * v_cena_rce / 60) | round(3) }}
            {% else %}
              0.0
            {% endif %}
          
          v_zysk_dzien_raw: "{{ states('input_number.alpha_rce_param_05') | float(-99999) }}"
          v_zysk_dzien: "{{ 0.0 if v_zysk_dzien_raw <= -99999 else v_zysk_dzien_raw }}"
          v_zysk_total_raw: "{{ states('input_number.alpha_rce_param_43') | float(-99999) }}"
          v_zysk_total: "{{ 0.0 if v_zysk_total_raw <= -99999 else v_zysk_total_raw }}"
          v_zysk_miesiac_raw: "{{ states('input_number.alpha_rce_param_44') | float(-99999) }}"
          v_zysk_miesiac: "{{ 0.0 if v_zysk_miesiac_raw <= -99999 else v_zysk_miesiac_raw }}"
          v_zysk_rok_raw: "{{ states('input_number.alpha_rce_param_45') | float(-99999) }}"
          v_zysk_rok: "{{ 0.0 if v_zysk_rok_raw <= -99999 else v_zysk_rok_raw }}"

      - if:
          - condition: template
            value_template: "{{ v_zysk_minuta > 0 or v_zysk_total_raw <= -99999 or v_zysk_miesiac_raw <= -99999 or v_zysk_rok_raw <= -99999 or v_zysk_dzien_raw <= -99999 }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.alpha_rce_param_05 }
            data: { value: "{{ (v_zysk_dzien + v_zysk_minuta) | round(3) }}" }
            continue_on_error: true
          - action: input_number.set_value
            target: { entity_id: input_number.alpha_rce_param_43 }
            data: { value: "{{ (v_zysk_total + v_zysk_minuta) | round(3) }}" }
            continue_on_error: true
          - action: input_number.set_value
            target: { entity_id: input_number.alpha_rce_param_44 }
            data: { value: "{{ (v_zysk_miesiac + v_zysk_minuta) | round(3) }}" }
            continue_on_error: true
          - action: input_number.set_value
            target: { entity_id: input_number.alpha_rce_param_45 }
            data: { value: "{{ (v_zysk_rok + v_zysk_minuta) | round(3) }}" }
            continue_on_error: true
            
      # AUTONAPRAWA LICZNIKA BALANSERA
      - variables:
          v_param_42_raw: "{{ states('input_number.alpha_rce_param_42') | float(0) }}"
      - if:
          - condition: template
            value_template: "{{ v_param_42_raw < 0 }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.alpha_rce_param_42 }
            data: { value: "{{ (v_param_42_raw + 99999) | int(0) }}" }
            continue_on_error: true
            
      - if:
          - condition: template
            value_template: "{{ now().strftime('%H:%M') == '23:59' }}"
        then:
          - action: input_number.set_value
            target: { entity_id: input_number.alpha_rce_param_05 }
            data: { value: 0 }
            continue_on_error: true
          - variables:
              v_max_soc_final_raw: "{{ states('input_number.alpha_rce_param_41') | float(-99999) }}"
              v_max_soc_final: "{{ 0.0 if v_max_soc_final_raw <= -99999 else v_max_soc_final_raw }}"
              v_dni_bez_balansu_raw: "{{ states('input_number.alpha_rce_param_42') | float(-99999) }}"
              v_dni_bez_balansu: "{{ 0 if v_dni_bez_balansu_raw <= -99999 else v_dni_bez_balansu_raw }}"
              nowy_licznik_balansu: >
                {% if v_max_soc_final >= 98.0 %}
                  0
                {% else %}
                  {{ v_dni_bez_balansu + 1 }}
                {% endif %}
          - action: input_number.set_value
            target: { entity_id: input_number.alpha_rce_param_42 }
            data: { value: "{{ nowy_licznik_balansu }}" }
            continue_on_error: true
          - action: input_number.set_value
            target: { entity_id: input_number.alpha_rce_param_41 }
            data: { value: 0 } 
            continue_on_error: true

  # =============================================================
  # MODUŁ: SMART RELAY (INTELIGENTNE PRZEKAŹNIKI Z HISTEREZĄ 2%)
  # =============================================================
  - if:
      - condition: template
        value_template: >
          {% if trigger is undefined or trigger is none %} false
          {% elif trigger.platform is undefined or trigger.platform is none %} false
          {% elif trigger.platform is defined and trigger.platform == 'time_pattern' %} true
          {% else %} false {% endif %}
    then:
      # --- PRZEKAŹNIK 1 ---
      - if:
          - condition: template
            value_template: "{{ v_r1_on and v_r1_dev | length > 5 }}"
        then:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ current_soc >= (v_r1_soc | float) }}"
                  - condition: template
                    value_template: "{{ states(v_r1_dev) == 'off' }}"
                sequence:
                  - action: homeassistant.turn_on
                    target: { entity_id: "{{ v_r1_dev }}" }
                    continue_on_error: true
              - conditions:
                  - condition: template
                    value_template: "{{ current_soc <= ((v_r1_soc | float) - 2) }}"
                  - condition: template
                    value_template: "{{ states(v_r1_dev) == 'on' }}"
                sequence:
                  - action: homeassistant.turn_off
                    target: { entity_id: "{{ v_r1_dev }}" }
                    continue_on_error: true

      # --- PRZEKAŹNIK 2 ---
      - if:
          - condition: template
            value_template: "{{ v_r2_on and v_r2_dev | length > 5 }}"
        then:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ current_soc >= (v_r2_soc | float) }}"
                  - condition: template
                    value_template: "{{ states(v_r2_dev) == 'off' }}"
                sequence:
                  - action: homeassistant.turn_on
                    target: { entity_id: "{{ v_r2_dev }}" }
                    continue_on_error: true
              - conditions:
                  - condition: template
                    value_template: "{{ current_soc <= ((v_r2_soc | float) - 2) }}"
                  - condition: template
                    value_template: "{{ states(v_r2_dev) == 'on' }}"
                sequence:
                  - action: homeassistant.turn_off
                    target: { entity_id: "{{ v_r2_dev }}" }
                    continue_on_error: true

  - if:
      - condition: template
        value_template: >
          {% set offg = (v_is_offgrid == 'true' or v_is_offgrid == true) %}
          {% set chce_lad = (v_chce_ladowac | string | lower | trim) == 'true' %}
          {% set is_charging = states(tou_switch_ent) == 'off' %}
          {% set podloga = v_swap_min_soc | float(20) %}
          {% set sufit = docelowy_soc | float(100) %}
          {# Jeśli jesteśmy poniżej podłogi, ładuj bezwzględnie. Inaczej ładuj, aż osiągniesz sufit, uwzględniając histerezę startową. #}
          {{ offg or (chce_lad and (current_soc <= podloga or (not is_charging and current_soc < (sufit - 1)) or (is_charging and current_soc < sufit))) }}
    then:
      - if:
          - condition: template
            value_template: "{{ states(tou_switch_ent) != 'off' }}"
        then:
          - action: switch.turn_off
            target: { entity_id: "{{ tou_switch_ent }}" }
            continue_on_error: true
    else:
      - if:
          - condition: template
            value_template: >
              {% set offg = (v_is_offgrid == 'true' or v_is_offgrid == true) %}
              {% set chce_lad = (v_chce_ladowac | string | lower | trim) == 'true' %}
              {{ not offg and states(tou_switch_ent) != 'on' and (current_soc >= (docelowy_soc | float(100)) or not chce_lad) }}
        then:
          - action: switch.turn_on
            target: { entity_id: "{{ tou_switch_ent }}" }
            continue_on_error: true
# =============================================================
# === KONIEC CZĘŚCI 4 ===
# =============================================================
