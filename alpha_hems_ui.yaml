              battery_current_191: sensor.deye_inverter_battery_bms_current
              grid_power_169: sensor.alpha_hems_siec_moc_calkowita
              day_grid_export_77: sensor.alpha_hems_dobowa_sprzedaz_siec
              grid_ct_power_172: sensor.deye_inverter_grid_l1_power
              day_load_energy_84: sensor.alpha_hems_dobowe_zuzycie_domu
              pv1_power_186: sensor.deye_inverter_pv1_power
              pv2_power_187: sensor.deye_inverter_pv2_power
              pv3_power_188: sensor.deye_slave_1_pv1_power
              pv4_power_189: sensor.deye_slave_1_pv2_power
              day_grid_import_76: sensor.alpha_hems_dobowy_zakup_siec
              grid_ct_power_total: sensor.alpha_hems_siec_moc_calkowita
