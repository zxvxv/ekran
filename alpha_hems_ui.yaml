# =============================================================
# === CZĘŚĆ 1 - KOTWICA GÓRNA (INICJALIZACJA I SENSORYKA) ===
# =============================================================
blueprint:
  name: "ALPHA HEMS v8.0387 (PRODUCTION READY)"
  description: >
    🚀 ALPHA HEMS v8.0387 🚀
    
    W PEŁNI AUTONOMICZNY SYSTEM ZARZĄDZANIA ENERGIĄ.
    
    HISTORIA ZMIAN:
    - v8.0387: (WEATHER SHIELD & PV OFFSET) Wdrożenie "Tarczy Dnia" - twardej blokady sprzedaży RCE między 06:00 a 16:00 dla dni poniżej 140% normy słonecznej. Płotek na wieczór (Target SOC) jest teraz dynamicznie pomniejszany o pozostałą produkcję PV z uwzględnieniem współczynnika bezpieczeństwa (x0.7).
    - v8.0386: (SMART SOC & UNCHAINED CHARGE) Usunięcie sztywnej rezerwy 20% (mnożnika 1.2) z kalkulacji Płotka. Płotek bazuje teraz ściśle na zużyciu i Buforze Komfortu. Optymalizacja krzywych ładowania: usunięcie kagańca 80% SOC i podniesienie progu pełnej mocy (do 80% w nocy i 85% w dzień) ze wsparciem uwolnionej dynamiki.
    - v8.0385: (INJECTION FIX & SMART DRAWERS) Naprawa pętli 06:00 niszczącej szufladkę nocną. Przebudowa Zastrzyku Danych (bezwarunkowe nadpisanie Skarbca).
    - v8.0384: (AUTUMN SHIELD) Zablokowanie pętli skracającej okno ładowania (ns.target_hour) dla dni pochmurnych.
    - v8.0383: (PŁOTEK FIX) Zatrzymanie zjazdu krzywej opadania Płotka.
    - v8.0382: (MORNING SHIELD) Zaostrzenie progu przejęcia obciążenia przez PV.
    - v8.038: (COST SYNC FIX) Zmiana źródła danych kosztu zakupu energii.

  domain: automation

  input:
    in_inverter_brand:
      name: "🔌 Profil Inwertera (Hardware Radar)"
      default: "Autodetekcja (Domyślnie)"
      selector:
        select:
          options:
            - "Autodetekcja (Domyślnie)"
            - "Deye"
            - "Flex 3L"
            - "Niestandardowy (Tłumacz ALPHA)"

    in_integration_type:
      name: "⚙️ TYP INTEGRACJI (Silnik)"
      default: "ESP32 (Standard)"
      selector:
        select:
          options:
            - ESP32 (Standard)
            - Solar Assistant

    in_hvac_sg_ready:
      name: "🌡️ Pompa Ciepła (SG Ready / Tanie okna)"
      description: "Wskaż encję pompy ciepła zintegrowanej z Home Assistant, aby wysterować jej załączenie przy najniższej cenie energii elektrycznej (okna taryfowe)."
      default: ""
      selector:
        entity:
          domain:
            - switch
            - input_boolean
            - water_heater
            - climate

    in_rce_sensor:
      name: "💰 Sensor Cen RCE"
      default: sensor.alpha_pse_dzisiaj_2
      selector:
        entity:
          domain: sensor

    in_ev_switch:
      name: "🚗 Przełącznik Ładowarki EV"
      default: ""
      selector:
        entity:
          domain:
            - switch
            - outlet
            - input_boolean

    in_ev_daily_energy_sensor:
      name: "📊 Licznik energii ładowarki EV (Total kWh)"
      default: ""
      selector:
        entity:
          domain: sensor

    in_ev_mode:
      name: "🚗 Tryb Pracy Ładowarki EV"
      default: "Wyłączony"
      selector:
        select:
          options:
            - "Wyłączony"
            - "Tylko Słońce (Nadwyżki)"
            - "Automatyczny (Słońce + Noc G12)"

    in_ev_dynamic_start:
      name: "🚗 Dynamiczny start (Nadwyżki z Szufladek)"
      default: false
      selector:
        boolean: {}

    in_ev_start_soc:
      name: "🚗 Ręczny próg startu ładowania z nadwyżek (%)"
      default: 90
      selector:
        number:
          min: 50
          max: 100
          step: 5
          mode: slider
          
    in_ev_vg:
      name: "🚗 Użyj EV do zbijania napięcia (>250.0V)"
      default: false
      selector:
        boolean: {}

    in_ev_soc_sensor:
      name: "🚗 Sensor SOC Samochodu (%) [Dla funkcji Grid-Lock]"
      default: ""
      selector:
        entity:
          domain: sensor

    in_ev_capacity:
      name: "🚗 Pojemność Baterii EV (kWh)"
      default: 50
      selector:
        number:
          min: 10
          max: 150
          step: 1
          mode: box

    in_ev_target_soc:
      name: "🚗 Docelowy poziom naładowania EV (%)"
      default: 80
      selector:
        number:
          min: 50
          max: 100
          step: 5
          mode: slider

    in_daily_consumption:
      name: "📊 Średnie dobowe zużycie energii (kWh) [Startowe]"
      default: 22
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: kWh
          mode: box

    in_vg_stage1_dev:
      name: "⚡ Ochrona Sieci: Stopień I (> 250.0V)"
      default: ""
      selector:
        entity:
          domain:
            - switch
            - light
            - input_boolean

    in_vg_stage2_dev:
      name: "⚡ Ochrona Sieci: Stopień II (> 251.5V)"
      default: ""
      selector:
        entity:
          domain:
            - switch
            - light
            - input_boolean
        
    in_notify_target:
      name: "📱 Wybierz telefon"
      default: "device_tracker.dummy"
      selector:
        entity:
          integration: mobile_app
          domain: device_tracker

    in_relay1_active:
      name: "🔌 Przekaźnik 1: Aktywacja"
      default: false
      selector:
        boolean: {}

    in_relay1_dev:
      name: "🔌 Przekaźnik 1: Urządzenie"
      default: ""
      selector:
        entity:
          domain:
            - switch
            - input_boolean
            - outlet

    in_relay1_soc:
      name: "🔌 Przekaźnik 1: Próg włączenia (SOC %)"
      default: 90
      selector:
        number:
          min: 50
          max: 100
          step: 1
          mode: slider

    in_relay2_active:
      name: "🔌 Przekaźnik 2: Aktywacja"
      default: false
      selector:
        boolean: {}

    in_relay2_dev:
      name: "🔌 Przekaźnik 2: Urządzenie"
      default: ""
      selector:
        entity:
          domain:
            - switch
            - input_boolean
            - outlet

    in_relay2_soc:
      name: "🔌 Przekaźnik 2: Próg włączenia (SOC %)"
      default: 95
      selector:
        number:
          min: 50
          max: 100
          step: 1
          mode: slider

    in_slave_count:
      name: "🔌 KASKADA: Ilość falowników SLAVE"
      default: "0"
      selector:
        select:
          options:
            - "0"
            - "1"

mode: queued
max: 3

variables:
  # =============================================================
  # BEZPOŚREDNIE CZYTANIE Z DASHBOARDU ORAZ KASKADY (SLAVE)
  # =============================================================
  v_slave_count: !input in_slave_count
  v_inverter_total: "{{ (v_slave_count | int(0)) + 1 }}"

  v_idle_mode: "{{ states('input_select.alpha_tryb_bilansowania') }}"
  v_net_billing: "{{ states('input_boolean.alpha_rce_flaga_01') == 'on' }}"
  v_cost_energy_fixed: "{{ states('input_text.alpha_rce_stan_06') | float(0.49) }}"
  v_min_profit: "{{ states('input_number.alpha_zysk_minimalny') | float(0.15) }}"
  
  v_sell_power_w_base: "{{ states('input_number.alpha_moc_sprzedazy') | float(6000) }}"
  v_sell_power_w: "{{ v_sell_power_w_base * v_inverter_total }}"
  v_sell_power: "{{ v_sell_power_w }}"
  
  v_osd: "{{ states('input_select.alpha_osd') }}"
  v_tariff: "{{ states('input_select.alpha_taryfa') }}"
  v_sim: "{{ states('input_boolean.alpha_rce_flaga_02') == 'on' }}"
  v_comfort_buffer: "{{ states('input_number.alpha_rezerwa_soc') | float(10) }}"
  v_comfort_buffer_smart: "{{ states('input_boolean.alpha_rce_flaga_03') == 'on' }}"
  v_notify_on: "{{ states('input_boolean.alpha_rce_flaga_04') == 'on' }}"
  v_batt_efficiency: 85
  
  v_is_summer_dump: false

  v_notify_device: !input in_notify_target
  v_rce_sensor: !input in_rce_sensor
  v_integration: !input in_integration_type
  
  v_hvac_dev: !input in_hvac_sg_ready
  
  v_r1_on: !input in_relay1_active
  v_r1_dev: !input in_relay1_dev
  v_r1_soc: !input in_relay1_soc

  v_r2_on: !input in_relay2_active
  v_r2_dev: !input in_relay2_dev
  v_r2_soc: !input in_relay2_soc
  
  v_ev_switch: !input in_ev_switch
  v_ev_sensor: !input in_ev_daily_energy_sensor
  v_ev_mode: !input in_ev_mode
  v_ev_dynamic_start: !input in_ev_dynamic_start
  v_ev_start_soc: !input in_ev_start_soc
  v_ev_vg: !input in_ev_vg
  
  v_ev_soc_sensor: !input in_ev_soc_sensor
  v_ev_capacity_raw: !input in_ev_capacity
  v_ev_capacity: "{{ v_ev_capacity_raw | float(50) }}"
  v_ev_target_raw: !input in_ev_target_soc
  v_ev_target: "{{ v_ev_target_raw | float(80) }}"

  v_solcast_risk: true
  v_solcast_threshold: 20.0
  is_aggr_trading_active: false
  
  in_daily_cons_raw: !input in_daily_consumption
  in_daily_cons: "{{ in_daily_cons_raw | float(22) }}"

  v_is_pge_summer_tariff: "{{ v_osd == 'PGE' and now().month >= 4 and now().month <= 9 }}"
  
  # === TWARDY ZAMEK TARYFOWY (Zamiast pływającego RCE) ===
  v_start_ladowania_raw: >
    {% if v_osd == 'PGE' %}
      {{ 15 if v_is_pge_summer_tariff else 13 }}
    {% elif v_osd == 'Tauron' %}
      13
    {% elif v_osd == 'Enea' %}
      13
    {% elif v_osd == 'Energa' %}
      13
    {% else %}
      13
    {% endif %}
  v_start_ladowania: "{{ v_start_ladowania_raw | int(13) }}"

  v_tou4_start: "{{ '15:00' if v_is_pge_summer_tariff else '13:00' }}"
  v_tou5_start: "{{ '17:00' if v_is_pge_summer_tariff else '15:00' }}"
  
  v_t_prognoza_shift: "{{ 15 if v_is_pge_summer_tariff else 13 }}"
  v_t_aggr_start_h: "{{ v_start_ladowania }}"
  v_t_aggr_end_h: "{{ v_start_ladowania + 1 }}"
  v_t_clean_h: "{{ '16:00' if v_is_pge_summer_tariff else '14:00' }}"

  v_hvac_cheap_active: >
    {% set h = now().hour %}
    {% set start_h = v_start_ladowania | int %}
    {{ 'true' if (h >= 22 or h < 6) or (h >= start_h and h < (start_h + 2)) else 'false' }}

  # =============================================================
  # ALPHA MASTER RCE SNAPSHOT (OPT Optymalizacja Zapytań JSON)
  # =============================================================
  v_rce_master_snapshot: >
    {% set prices = state_attr(v_rce_sensor, 'value') %}
    {% if not prices %} {% set prices = state_attr(v_rce_sensor, 'prices') %} {% endif %}
    {% set now_ts = as_timestamp(now()) %}
    {% set today_00 = today_at('00:00').timestamp() %}
    {% set tomorrow_00 = (today_at('00:00') + timedelta(days=1)).timestamp() %}
    {% set start_h = v_start_ladowania | int %}
    {% set ns = namespace(price_now=0.0, highest_past_ts=0, max_rano=-999.0, min_poludnie=999.0, min_pre_dip_ts=9999999999, min_pre_dip_val=9999.0, future_slots=[], future_prices=[]) %}
    {% if prices is iterable and prices is not string and prices is not mapping %}
      {% for p in prices %}
        {% set p_str = p.dtime | string %}
        {% set p_ts = as_timestamp(p_str, none) %}
        {% if p_ts != none %}
          {% set val = p.rce_pln | default(p.cen_cost | default(p.price | default(0))) | float(0) %}
          {% set val_pln = val / 1000 %}
          {% if p_ts <= now_ts and p_ts >= ns.highest_past_ts %}
            {% set ns.highest_past_ts = p_ts %}
            {% set ns.price_now = val %}
          {% endif %}
          {% if p_ts >= today_00 and p_ts < tomorrow_00 %}
            {% set p_hour = (p_ts | timestamp_custom('%H', true)) | int %}
            {% if 6 <= p_hour < 11 and val_pln > ns.max_rano %} {% set ns.max_rano = val_pln %} {% endif %}
            {% if 11 <= p_hour <= 14 and val_pln < ns.min_poludnie %} {% set ns.min_poludnie = val_pln %} {% endif %}
            {% if 6 <= p_hour < start_h and val < ns.min_pre_dip_val %}
              {% set ns.min_pre_dip_val = val %}
              {% set ns.min_pre_dip_ts = p_ts %}
            {% endif %}
          {% endif %}
          {% if p_ts >= (now_ts - 900) %}
            {% set ns.future_slots = ns.future_slots + [{'ts': p_ts, 'cena': val, 'dtime': p_str}] %}
            {% if val >= 10.0 %} {% set ns.future_prices = ns.future_prices + [val] %} {% endif %}
          {% endif %}
        {% endif %}
      {% endfor %}
    {% endif %}
    {{ {'price_now': (ns.price_now / 1000) | round(4), 'max_rano': ns.max_rano, 'min_poludnie': ns.min_poludnie, 'min_pre_dip_ts': ns.min_pre_dip_ts, 'future_slots': ns.future_slots, 'future_prices': ns.future_prices | sort(reverse=true)} | to_json }}

  # =============================================================
  # HARDWARE RADAR (Hybrydowa Autodetekcja i Tłumacz ALPHA)
  # =============================================================
  v_brand_input: !input in_inverter_brand
  esp_prefix: >
    {% if v_brand_input == 'Deye' %}
      deye_inverter
    {% elif v_brand_input == 'Flex 3L' %}
      hackman_flex3l
    {% elif v_brand_input == 'Niestandardowy (Tłumacz ALPHA)' %}
      alpha_hems
    {% else %}
      {% if states('sensor.deye_inverter_battery_bms_soc') not in ['unknown', 'unavailable', 'none', ''] %}
        deye_inverter
      {% elif states('sensor.flex_3l_battery_bms_soc') not in ['unknown', 'unavailable', 'none', ''] %}
        flex_3l
      {% elif states('sensor.hackman_flex3l_battery_bms_soc') not in ['unknown', 'unavailable', 'none', ''] %}
        hackman_flex3l
      {% else %}
        alpha_hems
      {% endif %}
    {% endif %}

  v_use_hal: "{{ esp_prefix == 'alpha_hems' }}"

  raw_soc_sensor: "{{ states.sensor | rejectattr('entity_id', 'search', esp_prefix) | selectattr('entity_id', 'search', '_state_of_charge$') | map(attribute='entity_id') | first | default('sensor.brak_encji_soc') }}"
  prefix: >
    {% if v_integration == 'Solar Assistant' %}
      {{ raw_soc_sensor.split('.')[1] | replace('_state_of_charge', '') if raw_soc_sensor != 'sensor.brak_encji_soc' else 'brak_prefixu' }}
    {% else %}
      {{ esp_prefix }}
    {% endif %}

  # =============================================================
  # KASKADOWE MAPOWANIE ENCJI Z OBRONĄ PRZED BŁĘDAMI
  # =============================================================
  low_soc_ent: >
    {% if v_integration == 'Solar Assistant' %} {{ states.number | rejectattr('entity_id', 'search', esp_prefix) | selectattr('entity_id', 'search', '_shutdown_capacity$') | map(attribute='entity_id') | first | default('number.brak_encji') }}
    {% elif v_use_hal == 'true' or v_use_hal == true %} number.alpha_hems_bateria_niski_soc
    {% else %} number.{{ prefix }}_battery_low_soc {% endif %}
  v_low_soc: "{{ states(low_soc_ent) | float(20) }}"
  v_swap_min_soc: "{{ v_low_soc | int }}"

  in_vg_1: !input in_vg_stage1_dev
  in_vg_2: !input in_vg_stage2_dev
  
  # ROZDZIELENIE FAZ: MIN DLA BLACKOUTU, MAX DLA VOLTAGE GUARD
  v_min_grid: >
    {% if v_use_hal == 'true' or v_use_hal == true %}
      {{ [states('sensor.alpha_hems_siec_l1_napiecie') | float(0),
          states('sensor.alpha_hems_siec_l2_napiecie') | float(0),
          states('sensor.alpha_hems_siec_l3_napiecie') | float(0)] | min }}
    {% else %}
      {{ [states('sensor.' ~ prefix ~ '_grid_l1_voltage') | float(0),
          states('sensor.' ~ prefix ~ '_grid_l2_voltage') | float(0),
          states('sensor.' ~ prefix ~ '_grid_l3_voltage') | float(0)] | min }}
    {% endif %}

  v_max_grid: >
    {% if v_use_hal == 'true' or v_use_hal == true %}
      {{ [states('sensor.alpha_hems_siec_l1_napiecie') | float(0),
          states('sensor.alpha_hems_siec_l2_napiecie') | float(0),
          states('sensor.alpha_hems_siec_l3_napiecie') | float(0)] | max }}
    {% else %}
      {{ [states('sensor.' ~ prefix ~ '_grid_l1_voltage') | float(0),
          states('sensor.' ~ prefix ~ '_grid_l2_voltage') | float(0),
          states('sensor.' ~ prefix ~ '_grid_l3_voltage') | float(0)] | max }}
    {% endif %}

  v_force_offgrid_ent: >
    {% if v_use_hal == 'true' or v_use_hal == true %} switch.alpha_hems_force_off_grid
    {% else %} switch.{{ prefix }}_force_off_grid {% endif %}
  v_is_offgrid: "{{ states(v_force_offgrid_ent) == 'on' or states('input_boolean.alpha_rce_flaga_15') == 'on' }}"

  v_kataklizm_aktywny: "{{ states('input_boolean.alpha_rce_flaga_06') == 'on' and states('input_boolean.alpha_rce_flaga_07') == 'on' }}"

  s_soc: >
    {% if v_integration == 'Solar Assistant' %} sensor.{{ prefix }}_state_of_charge
    {% elif v_use_hal == 'true' or v_use_hal == true %} sensor.alpha_hems_bateria_bms_soc
    {% else %} sensor.{{ prefix }}_battery_bms_soc {% endif %}
  s_volt: >
    {% if v_integration == 'Solar Assistant' %} sensor.{{ prefix }}_voltage
    {% elif v_use_hal == 'true' or v_use_hal == true %} sensor.alpha_hems_bateria_bms_napiecie
    {% else %} sensor.{{ prefix }}_battery_bms_voltage {% endif %}
  s_bms_current: >
    {% if v_integration == 'Solar Assistant' %} sensor.{{ prefix }}_battery_current
    {% elif v_use_hal == 'true' or v_use_hal == true %} sensor.alpha_hems_bateria_prad
    {% else %} sensor.{{ prefix }}_battery_bms_current {% endif %}
  s_temp: >
    {% if v_integration == 'Solar Assistant' %} sensor.{{ prefix }}_battery_temperature
    {% elif v_use_hal == 'true' or v_use_hal == true %} sensor.alpha_hems_bateria_temperatura
    {% else %} sensor.{{ prefix }}_battery_temperature {% endif %}
  s_rated_power: >
    {% if v_integration == 'Solar Assistant' %} sensor.{{ prefix }}_device_rated_power
    {% elif v_use_hal == 'true' or v_use_hal == true %} sensor.brak_encji_moc_znamionowa
    {% else %} sensor.{{ prefix }}_device_rated_power {% endif %}

  curr_ent: >
    {% if v_integration == 'Solar Assistant' %} {{ states.number | rejectattr('entity_id', 'search', esp_prefix) | selectattr('entity_id', 'search', '_max_charge_current$') | map(attribute='entity_id') | first | default('number.brak_encji') }}
    {% elif v_use_hal == 'true' or v_use_hal == true %} number.alpha_hems_max_prad_ladowania
    {% else %} number.{{ prefix }}_maximum_battery_charge_current {% endif %}
  discharge_ent: >
    {% if v_integration == 'Solar Assistant' %} {{ states.number | rejectattr('entity_id', 'search', esp_prefix) | selectattr('entity_id', 'search', '_max_discharge_current$') | map(attribute='entity_id') | first | default('number.brak_encji') }}
    {% elif v_use_hal == 'true' or v_use_hal == true %} number.alpha_hems_max_prad_rozladowania
    {% else %} number.{{ prefix }}_maximum_battery_discharge_current {% endif %}
  sell_power_ent: >
    {% if v_integration == 'Solar Assistant' %} {{ states.number | rejectattr('entity_id', 'search', esp_prefix) | selectattr('entity_id', 'search', '_max_sell_power$') | map(attribute='entity_id') | first | default('number.brak_encji') }}
    {% elif v_use_hal == 'true' or v_use_hal == true %} number.alpha_hems_max_moc_sprzedazy
    {% else %} number.{{ prefix }}_max_sell_power {% endif %}
  work_mode_ent: >
    {% if v_integration == 'Solar Assistant' %} {{ states.select | rejectattr('entity_id', 'search', esp_prefix) | selectattr('entity_id', 'search', '_work_mode$') | map(attribute='entity_id') | first | default('select.brak_encji') }}
    {% elif v_use_hal == 'true' or v_use_hal == true %} select.alpha_hems_system_work_mode
    {% else %} select.{{ prefix }}_system_work_mode {% endif %}
  tou_switch_ent: >
    {% if v_integration == 'Solar Assistant' %} {{ states.switch | rejectattr('entity_id', 'search', esp_prefix) | selectattr('entity_id', 'search', '_use_timer$') | map(attribute='entity_id') | first | default('switch.brak_encji') }}
    {% elif v_use_hal == 'true' or v_use_hal == true %} switch.alpha_hems_time_of_use
    {% else %} switch.{{ prefix }}_time_of_use {% endif %}
  solar_sell_ent: >
    {% if v_integration == 'Solar Assistant' %} switch.brak_encji
    {% elif v_use_hal == 'true' or v_use_hal == true %} switch.alpha_hems_solar_sell
    {% else %} switch.{{ prefix }}_solar_sell {% endif %}

  tou_sell_all_ent: >
    {% if v_integration == 'Solar Assistant' %} switch.brak_encji
    {% elif v_use_hal == 'true' or v_use_hal == true %} switch.alpha_hems_time_of_use_all_sell
    {% else %} switch.{{ prefix }}_time_of_use_all_sell {% endif %}

  ext_ct_ent: >
    {% if v_integration == 'Solar Assistant' %} sensor.{{ prefix }}_grid_power_ct
    {% elif v_use_hal == 'true' or v_use_hal == true %} sensor.alpha_hems_siec_moc_calkowita
    {% else %} sensor.{{ prefix }}_external_ct_power {% endif %}
  int_ct_ent: >
    {% if v_integration == 'Solar Assistant' %} sensor.{{ prefix }}_grid_power_ld
    {% elif v_use_hal == 'true' or v_use_hal == true %} sensor.brak_encji_int_ct
    {% else %} sensor.{{ prefix }}_internal_ct_power {% endif %}
  load_ent: >
    {% if v_integration == 'Solar Assistant' %} sensor.{{ prefix }}_load_power_essential
    {% elif v_use_hal == 'true' or v_use_hal == true %} sensor.alpha_hems_moc_domu_calkowita
    {% else %} sensor.{{ prefix }}_load_power {% endif %}

  # --- BLOKADA ENCJI TOU DLA ZEWNĘTRZNYCH INWERTERÓW ---
  tou1_s: >
    {% if v_integration == 'Solar Assistant' %} {{ states.select | rejectattr('entity_id', 'search', esp_prefix) | selectattr('entity_id', 'search', '_time_point_1$') | map(attribute='entity_id') | first | default('select.brak_encji') }}
    {% elif v_use_hal == 'true' or v_use_hal == true %} time.brak_encji
    {% else %} time.{{ prefix }}_time_of_use_1_start {% endif %}
  tou1_soc: >
