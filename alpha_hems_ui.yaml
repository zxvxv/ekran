  # =============================================================
  # POCZĄTEK MÓZGU RCE I PREDICTIVE DUMP (KORZYSTAJĄCY Z SNAPSHOTA)
  # =============================================================
  v_real_cost: >
    {% set cost = v_cost_energy_fixed | float(0) %}
    {% set eff = v_batt_efficiency | float(85) / 100 %}
    {{ (cost / eff) | round(2) if eff > 0 else cost }}

  v_prog_opacalnosci_bazowy: "{{ (v_real_cost | float(0) + v_min_profit | float(0)) | round(2) }}"

  v_brak_okienek: >
    {% set snap = v_rce_master_snapshot if v_rce_master_snapshot is mapping else (v_rce_master_snapshot | from_json) %}
    {% set prog = v_prog_opacalnosci_bazowy | float(0) * 1000 %}
    {% set ns = namespace(found=false) %}
    {% for slot in snap.future_slots %}
      {% if slot.cena >= prog %} {% set ns.found = true %} {% endif %}
    {% endfor %}
    {{ not ns.found }}

  v_pv_dzis: "{{ states('sensor.solcast_pv_forecast_prognoza_na_dzisiaj') | float(0) }}"
  v_prognoza_pv_jutro: "{{ states('sensor.solcast_pv_forecast_prognoza_na_jutro') | float(0) if now().hour >= v_t_prognoza_shift else states('sensor.solcast_pv_forecast_prognoza_na_dzisiaj') | float(0) }}"
  
  v_ev_dynamic_limit: >
    {% if v_prognoza_pv_jutro >= (v_solcast_threshold | float(20)) %}
      {% set wymog_kwh = cons_w | float %}
    {% else %}
      {% set wymog_kwh = cons_w | float + cons_p | float %}
    {% endif %}
    {% set wymog_soc = ((wymog_kwh / v_safe_cap) * 100) | round(0) | int + v_swap_min_soc | int + 1 %}
    {{ [wymog_soc, 100] | min | int }}

  v_ev_soc: "{{ states(v_ev_soc_sensor) | float(100) if v_ev_soc_sensor != '' else 100 }}"
  v_ev_missing_kwh: "{{ [0, (v_ev_target - v_ev_soc) / 100 * v_ev_capacity / 0.85] | max }}"
  v_available_soc: "{{ [0, current_soc - (v_swap_min_soc | float)] | max }}"
  v_available_kwh: "{{ (v_available_soc / 100) * v_safe_cap }}"
  
  v_ev_grid_lock: >
    {% if v_ev_switch != '' and states(v_ev_switch) == 'on' and (now().hour >= 22 or now().hour < 6) and v_ev_soc_sensor != '' %}
      {% set symulacja = v_sim | string | lower %}
      {% set net_billing = v_net_billing | string | lower %}
      {% set has_profit = (v_brak_okienek == 'False' or v_brak_okienek == false) and net_billing == 'true' and symulacja == 'false' %}
      {% set sunny_tomorrow = v_prognoza_pv_jutro >= (v_solcast_threshold | float(20)) %}
      {% if has_profit %}
        true 
      {% elif sunny_tomorrow %}
        {% if v_ev_missing_kwh > v_available_kwh %}
          true
        {% else %}
          false
        {% endif %}
      {% else %}
        true
      {% endif %}
    {% else %}
      false
    {% endif %}

  target_night_base: >
    {% set h = now().hour %}
    {% set m = now().minute %}
    {% set current_time_hours = h + (m / 60.0) %}
    {% set start_h = v_start_ladowania | int %}
    
    {% set dzienne_zapotrzebowanie = cons_n_jutro | float(0) + cons_p_jutro | float(0) + cons_w_jutro | float(0) %}
    {% set prognoza_slonca = v_prognoza_pv_jutro | float(0) %}
    {% set strefa_zielona = prognoza_slonca >= (dzienne_zapotrzebowanie * 1.4) %}
    {% set smart_toggle = (v_comfort_buffer_smart == true or v_comfort_buffer_smart == 'true') %}
    {% set bufor_komkomfortu = 0 if (strefa_zielona and smart_toggle) else (v_comfort_buffer | int(0)) %}
    
    {# 1. OBLICZANIE PUNKTU PRZECIĘCIA (KIEDY SŁOŃCE PRZEJMUJE DOM) #}
    {% set hourly_morning_load = cons_p_jutro | float(0) / [start_h - 6.0, 1.0] | max %}
    {% set forecast = state_attr('sensor.solcast_pv_forecast_prognoza_na_jutro' if h >= v_t_prognoza_shift else 'sensor.solcast_pv_forecast_prognoza_na_dzisiaj', 'detailedForecast') %}
    {% set ns = namespace(target_hour=start_h | float) %}
    
    {% if strefa_zielona %}
      {% if forecast is iterable and forecast is not string and forecast is not mapping %}
        {% for f in forecast %}
          {% set f_str = f.period_start | string %}
          {% set f_dt = as_datetime(f_str) %}
          {% if f_dt != none %}
            {% set f_dt_local = f_dt | as_local if f_dt.tzinfo != none else f_dt %}
            {% set f_h = f_dt_local.hour | float + (f_dt_local.minute / 60.0) %}
            {% if f_h >= 6.0 and f_h < start_h %}
              {% if (f.pv_estimate | float(0)) >= (hourly_morning_load * 1.2) %}
                {% if ns.target_hour == start_h %}
                  {% set ns.target_hour = f_h %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endif %}
        {% endfor %}
      {% endif %}
    {% endif %}
    
    {# 2. OBLICZANIE WYMAGANEJ ENERGII (KRZYWA OPADANIA Z KAGAŃCEM 20%) #}
    {% set req_kwh = 0.0 %}
    {% set clamp_poranek = (cons_p_jutro | float(0) * 0.2) if strefa_zielona else 0.0 %}
    {% if h >= 22 or h < 6 %}
      {% set zostalo_nocy_h = (24.0 - current_time_hours + 6.0) if h >= 22 else (6.0 - current_time_hours) %}
      {% set zostalo_poranka_h = ns.target_hour - 6.0 %}
      {% set base_req = (zostalo_nocy_h * (cons_n_jutro | float(0) / 8.0)) + (zostalo_poranka_h * hourly_morning_load) %}
      {% set req_kwh = [base_req, clamp_poranek] | max %}
    {% elif h >= 6 and h < start_h %}
      {% set zostalo_h = [ns.target_hour - current_time_hours, 0.0] | max %}
      {% set base_req = zostalo_h * hourly_morning_load %}
      {% set req_kwh = [base_req, clamp_poranek] | max %}
    {% endif %}
    
    {# 3. PRZELICZENIE NA SOC Z BEZPIECZNYM ZAPASEM #}
    {% set req_kwh_z_zapasem = req_kwh * 1.0 %}
    {% set soc = ((req_kwh_z_zapasem / v_safe_cap) * 100) | round(0) | int + v_swap_min_soc | int + bufor_komkomfortu + 1 %}
    
    {% if h >= 22 or h < start_h %}
      {{ [soc, 100] | min | int }}
    {% else %}
      {{ (v_swap_min_soc | int) + bufor_komkomfortu }}
    {% endif %}

  target_night: >
    {% if v_ev_grid_lock == 'true' or v_ev_grid_lock == true %}
      {{ [current_soc | int, target_night_base | int] | max }}
    {% else %}
      {{ target_night_base | int }}
    {% endif %}

  target_evening: >
    {% set h = now().hour %}
    {% set m = now().minute %}
    {% set current_time_hours = h + (m / 60.0) %}
    {% set end_cheap = (v_start_ladowania | int) + 4 %}
    {% set dzienne_zapotrzebowanie = cons_n_jutro | float(0) + cons_p_jutro | float(0) + cons_w_jutro | float(0) %}
    {% set wymagane_slonce = dzienne_zapotrzebowanie * 1.4 %}
    {% set sunny = v_prognoza_pv_jutro | float(0) >= wymagane_slonce %}
    {% set smart_toggle = (v_comfort_buffer_smart == true or v_comfort_buffer_smart == 'true') %}
    {% set bufor_komkomfortu = 0 if (sunny and smart_toggle) else (v_comfort_buffer | int(0)) %}
    
    {% if current_time_hours >= end_cheap and current_time_hours < 22 %}
      {% set caly_wieczor_h = 22.0 - end_cheap %}
      {% set temp_zostalo = [(22.0 - current_time_hours), caly_wieczor_h] | min %}
      {% set zostalo_wieczoru_h = [temp_zostalo, 0.0] | max %}
      {% set req_kwh = cons_w | float(0) * (zostalo_wieczoru_h / caly_wieczor_h) %}
    {% elif current_time_hours < end_cheap %}
      {% set req_kwh = cons_w | float(0) %}
    {% else %}
      {% set req_kwh = 0.0 %}
    {% endif %}
    
    {% set pozostale_pv = states('sensor.solcast_pv_forecast_pozostala_prognoza_na_dzis') | float(0) * 0.7 %}
    {% set req_kwh_net = [req_kwh - pozostale_pv, 0.0] | max %}
    {% set energia_z_zapasem = req_kwh_net * 1.0 %}
    {% set soc = ((energia_z_zapasem / v_safe_cap) * 100) | round(0) | int + v_swap_min_soc | int + bufor_komkomfortu + 1 %}
