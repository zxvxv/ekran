              radiator_temp_91: sensor.deye_inverter_ac_temperature
              dc_transformer_temp_90: sensor.magazyn_pomieszczenie_temperatura
              solar_sell_247: switch.deye_inverter_solar_sell
              day_battery_charge_70: sensor.alpha_hems_dobowe_ladowanie_baterii
              battery_soc_184: sensor.deye_inverter_battery
              battery_rated_capacity: number.deye_inverter_battery_capacity
              battery_shutdown_soc: number.deye_inverter_battery_shutdown_soc_low_dc
      # =============================================================
      # KOTWICA DOLNA - KONIEC KARTY PRZEPŁYWÓW SUNSYNK
      # =============================================================
  - type: panel
    path: dom
    title: "DOM"
    icon: mdi:home
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: >
              ## 📊 ALPHA HEMS: Status & Cel

              **🧠 Decyzja Mózgu (Plan):** {{ states('input_text.alpha_rce_stan_01') }}
              
              **⚙️ Aktualny Status:** {{ states('input_text.alpha_rce_stan_03') }}

              ---
              {% set cap_raw = states('number.deye_inverter_battery_capacity') | float(47.0) %}
              {% set fallback_cap = (cap_raw * 51.2 / 1000) | round(1) if cap_raw > 150 else cap_raw | round(1) %}
              {% set cap = states('input_number.alpha_pojemnosc_magazynu') | float(fallback_cap) %}
              {% set plotek = states('input_number.alpha_rce_param_20') | float(0) %}
              **Cel ładowania (Płotek):** {{ ((plotek / 100) * cap) | round(1) }} kWh

              **Bieżąca cena RCE:** {{ states('input_number.alpha_rce_param_01') }} zł/kWh

          - type: markdown
            title: "🧠 Rentgen Decyzji (Autoscale RCE & Logika 140%)"
            content: >
              {% set kaskada = is_state('input_boolean.alpha_kaskada_aktywna', 'on') %}
              {% set mnoznik = 2 if kaskada else 1 %}
              {% set sensor_rce = 'sensor.alpha_pse_dzisiaj' %}
              {% set cap_raw = states('number.deye_inverter_battery_capacity') | float(47.0) %}
              {% set fallback_cap = (cap_raw * 51.2 / 1000) | round(1) if cap_raw > 150 else cap_raw | round(1) %}
              {% set poj = states('input_number.alpha_pojemnosc_magazynu') | float(fallback_cap) %}
              {% set bazowa_moc = states('input_number.alpha_moc_sprzedazy') | float(6000) %}
              {% set moc_kw = (bazowa_moc * mnoznik) / 1000 %}

              {# AUTODETEKCJA ENCJI LOW SOC Z FALOWNIKA ORAZ FLAGI ZIMY #}
              {% set low_soc_ent = (states.number | selectattr('entity_id', 'search', 'battery_low_soc$|shutdown_capacity$') | map(attribute='entity_id') | list | first) | default('number.deye_inverter_battery_low_soc') %}
              {% set live_low_soc = states(low_soc_ent) | float(20) %}
              {% set zimowy_beton = 10 if states('input_boolean.alpha_rce_flaga_12') == 'on' else 0 %}
              {% set hardware_low_soc = live_low_soc + zimowy_beton %}
              
              {# TWARDY ZACISK (ANTI-SPIKE MARGIN) - Low SOC * 1.1 #}
              {% set bezpieczna_podloga = (live_low_soc * 1.1) | round(0) | int + zimowy_beton %}
              {% set bezpieczna_podloga_kwh = (bezpieczna_podloga / 100) * poj %}

              {# DYNAMICZNE MAPOWANIE SZUFLADEK WZGLEDEM DNIA TYGODNIA #}
              {% set d = now().weekday() %}
              {% set d_jutro = (now() + timedelta(days=1)).weekday() %}
              
              {% set map_n = {0: 11, 1: 12, 2: 13, 3: 14, 4: 15, 5: 16, 6: 17} %}
              {% set map_p = {0: 21, 1: 22, 2: 23, 3: 24, 4: 25, 5: 26, 6: 27} %}
              {% set map_w = {0: 31, 1: 32, 2: 33, 3: 34, 4: 35, 5: 36, 6: 37} %}
              
              {% set n_dzis = states('input_number.alpha_rce_param_' ~ map_n[d]) | float(0) %}
              {% set p_dzis = states('input_number.alpha_rce_param_' ~ map_p[d]) | float(0) %}
              {% set w_dzis = states('input_number.alpha_rce_param_' ~ map_w[d]) | float(0) %}
              
              {% set n_jutro = states('input_number.alpha_rce_param_' ~ map_n[d_jutro]) | float(0) %}
              {% set p_jutro = states('input_number.alpha_rce_param_' ~ map_p[d_jutro]) | float(0) %}
              {% set w_jutro = states('input_number.alpha_rce_param_' ~ map_w[d_jutro]) | float(0) %}

              {# POBRANIE POPRAWNEJ PROGNOZY PV W ZALEŻNOŚCI OD USTAWIENIA #}
              {% set pv_dzis = states('sensor.solcast_pv_forecast_prognoza_na_dzisiaj') | float(0) %}
              {% set pv_jutro = states('sensor.solcast_pv_forecast_prognoza_na_jutro') | float(0) %}

              {% set status_plotek = states('input_number.alpha_rce_param_20') | float(0) %}

              {# LOGIKA SMART MORNING (Nocna ocena Jutra vs Dzień oceniany Dziś) #}
              {% set total_dzis = n_dzis + p_dzis + w_dzis %}
              {% set wymog_140_dzis = total_dzis * 1.4 %}
              {% set is_sunny_dzis = pv_dzis >= wymog_140_dzis %}
              
              {% set total_jutro = n_jutro + p_jutro + w_jutro %}
              {% set wymog_140_jutro = total_jutro * 1.4 %}
              {% set is_sunny_jutro = pv_jutro >= wymog_140_jutro %}
              {% set mnoznik_p = 0.2 if is_sunny_jutro else 1.2 %}

              ### 📦 Fizyka Magazynu i Rejestry
              * Obecny Magazyn: **{{ ((states('sensor.deye_inverter_battery_bms_soc') | float(0) / 100) * poj) | round(1) }} kWh** | Cel (Płotek): **{{ ((status_plotek / 100) * poj) | round(1) }} kWh**
              {% set wolny_soc = [states('sensor.deye_inverter_battery_bms_soc') | float(0) - status_plotek, 0] | max %}
              {% set wolna_energia = (wolny_soc / 100) * poj %}
              * Energia do zrzutu: **{{ wolna_energia | round(2) }} kWh**
              
              {% set pojemnosc_slupka = moc_kw * 0.25 %}
              {% set slupki_req = (wolna_energia / pojemnosc_slupka) | round(0, 'ceil') | int %}
              * Falownik ({{ moc_kw }} kW) wymaga **{{ slupki_req }} słupków** do zrzutu (Pojemność słupka = {{ pojemnosc_slupka | round(2) }} kWh).

              ---

              ### 🗄️ 1. STAN PAMIĘCI REJESTRÓW (Twarde Dane)
              * Zużycie Noc DZIŚ: **{{ n_dzis }} kWh**
              * Zużycie Poranek DZIŚ: **{{ p_dzis }} kWh**
              * Zużycie Wieczór DZIŚ: **{{ w_dzis }} kWh**
              * Prognoza Słońca na Dziś: **{{ pv_dzis }} kWh**
              * Prognoza Słońca na Jutro: **{{ pv_jutro }} kWh**
              * Odczytana encja sprzętowa: `{{ low_soc_ent }}` ➔ **{{ ((live_low_soc / 100) * poj) | round(1) }} kWh** {% if zimowy_beton > 0 %}(+ Beton Zimowy = {{ ((hardware_low_soc / 100) * poj) | round(1) }} kWh){% endif %}
              * **🛡️ Ochrona Skokowa (Anti-Spike Clamp): Min. {{ bezpieczna_podloga_kwh | round(1) }} kWh**

              ---

              {% set bufor_komfortu_kwh = (states('input_number.alpha_rezerwa_soc') | float(0) / 100) * poj %}
              {% set smart_toggle = states('input_boolean.alpha_rce_flaga_03') == 'on' %}
              {% set aktywny_bufor_kwh = 0 if (is_sunny_jutro and smart_toggle) else bufor_komfortu_kwh %}
              {% set hardware_low_soc_kwh = (hardware_low_soc / 100) * poj %}
              {% set jeden_procent_kwh = (poj * 0.01) %}

              ### 🧮 2. MATRYCA OBLICZEŃ PŁOTKA (Docelowa Energia)
              {% if is_sunny_jutro %}
              > **☀️ SMART MORNING AKTYWNY (Prognoza > 140%):** Słońce JUTRO przejmuje obciążenie. Zapas poranny ścięty do 20% (tylko na rozruch do 7:00).
              {% else %}
              > **☁️ STANDARD (Prognoza < 140%):** Ładuję w nocy pełne zapotrzebowanie poranka + 20% bufora bezpieczeństwa na JUTRO.
              {% endif %}

              👉 **Kalkulacja dla okresu porannego (Zabezpieczenie Poranka):**
              {% set calc_poranek_kwh = (p_dzis * mnoznik_p) + hardware_low_soc_kwh + aktywny_bufor_kwh + jeden_procent_kwh %}
              {{ p_dzis }} kWh × {{ mnoznik_p }} = **{{ (p_dzis * mnoznik_p) | round(2) }} kWh**
              + Low SOC ({{ hardware_low_soc_kwh | round(1) }} kWh) + Bufor ({{ aktywny_bufor_kwh | round(1) }} kWh) + 1% ({{ jeden_procent_kwh | round(1) }} kWh) = Wynik tymczasowy: {{ calc_poranek_kwh | round(2) }} kWh
              ➔ 🛡️ Twardy docisk (Clamp): **Ostateczny wynik: {{ [calc_poranek_kwh, bezpieczna_podloga_kwh] | max | round(1) }} kWh**

              👉 **Kalkulacja dla okresu wieczornego (Zabezpieczenie Wieczoru):**
              {% set calc_wieczor_kwh = (w_dzis * 1.2) + hardware_low_soc_kwh + aktywny_bufor_kwh + jeden_procent_kwh %}
              {{ w_dzis }} kWh × 1.2 = **{{ (w_dzis * 1.2) | round(2) }} kWh**
              + Low SOC ({{ hardware_low_soc_kwh | round(1) }} kWh) + Bufor ({{ aktywny_bufor_kwh | round(1) }} kWh) + 1% ({{ jeden_procent_kwh | round(1) }} kWh) = Wynik tymczasowy: {{ calc_wieczor_kwh | round(2) }} kWh
              ➔ 🛡️ Twardy docisk (Clamp): **Ostateczny wynik: {{ [calc_wieczor_kwh, bezpieczna_podloga_kwh] | max | round(1) }} kWh**

              ---

              ### 🛡️ 3. LOGIKA 140% & PODWÓJNY CYKL (Double-Cycle Arbitrage)
              * Łączne zapotrzebowanie DZIŚ: **{{ total_dzis | round(2) }} kWh** | Wymóg PV 140%: **{{ wymog_140_dzis | round(2) }} kWh**
              * Słońce Dziś ({{ pv_dzis }} kWh) ≥ Wymóg 140%? ➔ **{{ '✅ TAK (Filar 1 autoryzowany)' if is_sunny_dzis else '❌ NIE (Standardowa ochrona, zrzut zablokowany)' }}**
              
              {% set prices = state_attr(sensor_rce, 'value') %}
              {% if not prices %} {% set prices = state_attr(sensor_rce, 'prices') %} {% endif %}
              {% set ns = namespace(max_rano=-999.0, min_poludnie=999.0) %}
              {% if prices is iterable and prices is not string and prices is not mapping %}
                {% for p in prices %}
                  {% set p_str = p.dtime | string %}
                  {% set p_dt = as_datetime(p_str) %}
                  {% if p_dt == none %} {% set p_dt = strptime(p_str, '%Y-%m-%d %H:%M:%S', strptime(p_str, '%Y-%m-%d %H:%M', none)) %} {% endif %}
                  {% set p_ts = as_timestamp(p_dt) if p_dt != none else none %}
                  {% if p_ts != none and p_ts >= today_at('00:00').timestamp() %}
                    {% set p_hour = (p_ts | timestamp_custom('%H', true)) | int %}
                    {% set val = p.rce_pln | default(p.cen_cost | default(p.price | default(0))) | float(0) / 1000 %}
                    {% if 6 <= p_hour < 11 %}
                      {% if val > ns.max_rano %} {% set ns.max_rano = val %} {% endif %}
                    {% endif %}
                    {% if 11 <= p_hour <= 14 %}
                      {% if val < ns.min_poludnie %} {% set ns.min_poludnie = val %} {% endif %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% endif %}
              {% set spread = (ns.max_rano - ns.min_poludnie) | round(2) %}
              {% set sniper_threshold = (ns.min_poludnie + 0.20) | round(4) %}
              
              * 📉 Max cena rano: **{{ ns.max_rano }} zł/kWh** | 📈 Min cena południe: **{{ ns.min_poludnie }} zł/kWh**
              * Obliczony Spread (Różnica): **{{ spread }} zł/kWh**
              * Podwójny Cykl Opłacalny (Spread >= 0.20 zł)? ➔ **{{ '✅ TAK (Filar 2 autoryzowany)' if spread >= 0.20 else '❌ NIE (Różnica w cenie nie opłaca amortyzacji)' }}**
              * 🎯 **Dynamiczny Celownik Snajpera (Dołek + 20 gr): {{ sniper_threshold }} zł/kWh**

              ---

              ### 📈 Planowanie Okienek Handlowych (Autoscale RCE)
              {% set now_ts = as_timestamp(now()) %}
              {% set h = now().hour %}
              {% set prognoza_shift = 15 if states('input_boolean.alpha_rce_flaga_12') == 'on' else 13 %}
              {% set t_aggr = 15 if states('input_boolean.alpha_rce_flaga_12') == 'on' else 13 %}
              {% set prog = states('input_number.alpha_rce_param_03') | float(0) * 1000 %}
              {% set ns = namespace(future_active=[], is_now=false) %}
              {% if slupki_req > 0 and prices is iterable and prices is not string and prices is not mapping %}
                {% for p in prices %}
                  {% set p_ts = as_timestamp(as_datetime(p.dtime | string)) if as_datetime(p.dtime | string) != none else as_timestamp(strptime(p.dtime | string, '%Y-%m-%d %H:%M:%S', strptime(p.dtime | string, '%Y-%m-%d %H:%M', none))) %}
                  {% if p_ts != none and p_ts >= (now_ts - 900) %}
                    {% if (h < t_aggr and p_ts < as_timestamp(today_at('%02d:01' % t_aggr))) or (h >= prognoza_shift) %}
                      {% set val = p.rce_pln | default(p.cen_cost | default(p.price | default(0))) | float(0) %}
                      {% if val >= prog %}
                        {% set ns.future_active = ns.future_active + [{'dtime': p.dtime | string, 'cena': val, 'ts': p_ts}] %}
                      {% endif %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {% if ns.future_active | length > 0 %}
                  {% set top_slupki = ns.future_active | sort(attribute='cena', reverse=true) | batch(slupki_req) | first | default([]) %}
                  **🎯 Celownik Systemu (TOP {{ slupki_req }}):**
                  {% for b in top_slupki %}
                    - {{ b.dtime[11:16] }} -> **{{ b.cena }}** zł/MWh
                    {% if now_ts >= b.ts and now_ts < (b.ts + 900) %}
                      {% set ns.is_now = true %}
                    {% endif %}
                  {% endfor %}
                  **🛑 Werdykt Rentgena:** {{ '✅ Cel zablokowany: SPRZEDAŻ!' if ns.is_now else '⏳ Oczekuję na lepsze ceny.' }}
                {% else %}
                  **🛑 Werdykt Rentgena:** Brak opłacalnych okienek powyżej progu.
                {% endif %}
              {% else %}
                **🛑 Werdykt Rentgena:** Brak wolnej energii do zrzutu lub ujemne ceny.
              {% endif %}

          - type: markdown
            title: "🌙 Sektor Nocny (22:00-06:00)"
            content: >
              - **Poniedziałek:** {{ states('input_number.alpha_rce_param_11') }} kWh
              - **Wtorek:** {{ states('input_number.alpha_rce_param_12') }} kWh
              - **Środa:** {{ states('input_number.alpha_rce_param_13') }} kWh
              - **Czwartek:** {{ states('input_number.alpha_rce_param_14') }} kWh
              - **Piątek:** {{ states('input_number.alpha_rce_param_15') }} kWh
              - **Sobota:** {{ states('input_number.alpha_rce_param_16') }} kWh
              - **Niedziela:** {{ states('input_number.alpha_rce_param_17') }} kWh

          - type: markdown
            title: "🌅 Sektor Poranny (06:00-13:00)"
            content: >
              - **Poniedziałek:** {{ states('input_number.alpha_rce_param_21') }} kWh
              - **Wtorek:** {{ states('input_number.alpha_rce_param_22') }} kWh
              - **Środa:** {{ states('input_number.alpha_rce_param_23') }} kWh
              - **Czwartek:** {{ states('input_number.alpha_rce_param_24') }} kWh
              - **Piątek:** {{ states('input_number.alpha_rce_param_25') }} kWh
              - **Sobota:** {{ states('input_number.alpha_rce_param_26') }} kWh
              - **Niedziela:** {{ states('input_number.alpha_rce_param_27') }} kWh

          - type: markdown
            title: "🌆 Sektor Wieczorny (13:00-22:00)"
            content: >
              - **Poniedziałek:** {{ states('input_number.alpha_rce_param_31') }} kWh
              - **Wtorek:** {{ states('input_number.alpha_rce_param_32') }} kWh
              - **Środa:** {{ states('input_number.alpha_rce_param_33') }} kWh
              - **Czwartek:** {{ states('input_number.alpha_rce_param_34') }} kWh
              - **Piątek:** {{ states('input_number.alpha_rce_param_35') }} kWh
              - **Sobota:** {{ states('input_number.alpha_rce_param_36') }} kWh
              - **Niedziela:** {{ states('input_number.alpha_rce_param_37') }} kWh

          - type: entities
            title: "⚡ Monitoring Napięcia Fazy"
            show_header_toggle: false
            entities:
              - entity: sensor.deye_inverter_grid_l1_voltage
                name: "Faza L1"
              - entity: sensor.deye_inverter_grid_l2_voltage
                name: "Faza L2"
              - entity: sensor.deye_inverter_grid_l3_voltage
                name: "Faza L3"
              - type: section
              - entity: input_boolean.alpha_rce_flaga_10
                name: "🔄 WYMUŚ ALPHA SYNC / SETUP"
                icon: mdi:tools

  # =============================================================
  # ZAKŁADKA 4: 🔄 PRZEPŁYW (Widok uproszczony)
  # =============================================================
  - type: panel
    path: flow-view
    title: PRZEPŁYW
    icon: mdi:sync
    cards:
      - type: custom:sunsynk-power-flow-card
        cardstyle: lite
        wide: false
        large_font: true
        show_solar: true
        show_battery: true
        show_grid: true
        center_no_grid: true
        card_height: '750'
        card_width: 100%
        decimal_places: 2
        decimal_places_energy: 1
        dynamic_line_width: true
        max_line_width: 4
        min_line_width: 1
        inverter:
          three_phase: true
          auto_scale: true
          modern: true
          colour: '#217cb5'
          autarky: power
        battery:
          show_daily: true
          auto_scale: true
          show_absolute: true
          colour: '#c01b1b'
          charge_colour: '#435bd0'
          dynamic_colour: true
          linear_gradient: true
          show_remaining_energy: true
          energy: 47616
          shutdown_soc: 6
        battery2:
          energy: 0
          shutdown_soc: 20
