    {% elif (v_kataklizm_aktywny == 'true' or v_kataklizm_aktywny == true) %} Oczekiwanie
    {% elif v_tarcza_aktywna == 'true' or v_tarcza_aktywna == true %} Oczekiwanie
    {% elif is_day_shield %} Oczekiwanie
    {% else %}
      {% set snap = v_rce_master_snapshot if v_rce_master_snapshot is mapping else (v_rce_master_snapshot | from_json) %}
      {% set prog = v_sell_threshold | float(0) * 1000 %}
      {% set now_ts = as_timestamp(now()) %}
      {% set d_soc = docelowy_soc | float(((v_swap_min_soc | float) * 1.1) | round(0) | int) %}
      {% set wolny_soc = [current_soc - d_soc, 0] | max %}
      {% set wolna_energia = (wolny_soc / 100) * v_safe_cap %}
      {% set moc_kw = v_sell_power_w | float(6000) / 1000 %}
      {% set energia_na_slupek = moc_kw * 0.25 %}
      {% set max_slupkow = (wolna_energia / energia_na_slupek) | round(0, 'ceil') | int %}
      
      {% if max_slupkow > 0 and snap.future_slots | length > 0 %}
        {% set ns = namespace(future_active=[], is_now=false) %}
        {% set is_sniper = (v_midnight_sniper_active == 'true' or v_midnight_sniper_active == true) and (now().hour >= 22 or now().hour < start_h) %}
